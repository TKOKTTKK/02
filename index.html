<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TronCollector 调用面板 · Nile</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --line:#222c3d; --txt:#e6edf7; --dim:#8b9bb4;
    --acc:#26c68a; --acc2:#3d8bfd; --warn:#f0a33c; --err:#f2565c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 600px at 15% -10%,#16233a 0%,var(--bg) 55%);color:var(--txt);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       padding:22px 16px 60px;min-height:100vh}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1 1 220px;min-width:0}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  input,select{width:100%;background:#0d121b;border:1px solid var(--line);color:var(--txt);
       border-radius:9px;padding:9px 11px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
       outline:none;transition:border-color .15s}
  input:focus,select:focus{border-color:var(--acc2)}
  button{cursor:pointer;border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:600;
       background:var(--acc2);color:#fff;transition:filter .15s,opacity .15s}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  button.go{background:var(--acc);color:#06231a}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td{padding:7px 0;border-bottom:1px solid #1a2232;vertical-align:top}
  td:first-child{color:var(--dim);width:104px;white-space:nowrap}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .ok{background:rgba(38,198,138,.15);color:var(--acc)}
  .bad{background:rgba(242,86,92,.15);color:var(--err)}
  .wait{background:rgba(240,163,60,.15);color:var(--warn)}
  #log{background:#080b11;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
       height:170px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.8px;line-height:1.65;color:#9fb0c8}
  #log div{padding:1px 0}
  #log .e{color:var(--err)}
  #log .s{color:var(--acc)}
  #log .w{color:var(--warn)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:8px}
  .badge{font-size:11px;color:var(--dim)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>TronCollector 调用面板</h1>
  <div class="sub">Nile 测试网 · 只读查询不需要钱包 · 发起归集需要用 owner/operator 那个地址的钱包签名</div>

  <div class="card">
    <h2>连接</h2>
    <div class="row">
      <div class="grow">
        <label>合约地址</label>
        <input id="contract" value="TDXCLpQXJw5dmCrjTbFSurwg3TdfxEPLnL" spellcheck="false">
      </div>
      <div class="grow">
        <label>代币地址（Nile 测试 USDT）</label>
        <input id="token" value="TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf" spellcheck="false">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnConnect" class="ghost">连接 TronLink</button>
      <button id="btnRead" class="go">读取链上状态</button>
      <span id="walletBadge" class="badge">钱包：未连接</span>
    </div>
    <div class="hint">TronLink 网络要切到 Nile。面板只读走公共节点，签名才用你的钱包。</div>
  </div>

  <div class="card">
    <h2>合约状态</h2>
    <table>
      <tr><td>owner</td><td class="mono" id="v-owner">—</td></tr>
      <tr><td>operator</td><td class="mono" id="v-operator">—</td></tr>
      <tr><td>hotWallet</td><td class="mono" id="v-hot">—</td></tr>
      <tr><td>paused</td><td id="v-paused">—</td></tr>
      <tr><td>version</td><td class="mono" id="v-ver">—</td></tr>
    </table>
  </div>

  <div class="card">
    <h2>归集 collect</h2>
    <div class="split">
      <div>
        <label>from（被归集的用户地址）</label>
        <input id="from" placeholder="T..." spellcheck="false">
      </div>
      <div>
        <label>数量（人类可读，如 12.5）</label>
        <input id="amount" placeholder="自动 = min(授权额度, 余额)" spellcheck="false">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnQuery" class="ghost">查授权额度 / 余额</button>
      <button id="btnCollect" class="go">发起归集（签名）</button>
    </div>
    <table style="margin-top:12px">
      <tr><td>授权额度</td><td class="mono" id="v-allow">—</td></tr>
      <tr><td>该地址余额</td><td class="mono" id="v-bal">—</td></tr>
      <tr><td>实际归集量</td><td class="mono" id="v-amount">—</td></tr>
    </table>
    <div class="hint">归集去向写死在合约里（hotWallet），调用者不能指定收款地址。value 以最小单位上链，USDT 是 6 位小数。</div>
  </div>

  <div class="card">
    <h2>日志</h2>
    <div id="log"></div>
  </div>
</div>

<script>
(function () {
  var HOST = 'https://nile.trongrid.io';
  var CDN = [
    'https://cdn.jsdelivr.net/npm/tronweb@6.0.4/dist/TronWeb.js',
    'https://unpkg.com/tronweb@6.0.4/dist/TronWeb.js',
    'https://cdnjs.cloudflare.com/ajax/libs/tronweb/6.0.4/TronWeb.js'
  ];

  var ABI = [
    {name:'owner',type:'function',stateMutability:'view',inputs:[],outputs:[{name:'',type:'address'}]},
    {name:'operator',type:'function',stateMutability:'view',inputs:[],outputs:[{name:'',type:'address'}]},
    {name:'hotWallet',type:'function',stateMutability:'view',inputs:[],outputs:[{name:'',type:'address'}]},
    {name:'paused',type:'function',stateMutability:'view',inputs:[],outputs:[{name:'',type:'bool'}]},
    {name:'version',type:'function',stateMutability:'pure',inputs:[],outputs:[{name:'',type:'string'}]},
    {name:'remainingAllowance',type:'function',stateMutability:'view',inputs:[{name:'token',type:'address'},{name:'from',type:'address'}],outputs:[{name:'',type:'uint256'}]},
    {name:'tokenBalanceOf',type:'function',stateMutability:'view',inputs:[{name:'token',type:'address'},{name:'who',type:'address'}],outputs:[{name:'',type:'uint256'}]},
    {name:'collect',type:'function',stateMutability:'nonpayable',inputs:[{name:'token',type:'address'},{name:'from',type:'address'},{name:'value',type:'uint256'}],outputs:[{name:'',type:'bool'}]}
  ];
  var TRC20 = [
    {name:'decimals',type:'function',stateMutability:'view',inputs:[],outputs:[{name:'',type:'uint8'}]},
    {name:'balanceOf',type:'function',stateMutability:'view',inputs:[{name:'who',type:'address'}],outputs:[{name:'',type:'uint256'}]},
    {name:'allowance',type:'function',stateMutability:'view',inputs:[{name:'owner',type:'address'},{name:'spender',type:'address'}],outputs:[{name:'',type:'uint256'}]}
  ];

  var $ = function (id) { return document.getElementById(id); };
  var ro = null;           // 只读实例
  var linkWeb = null;      // 钱包实例
  var walletAddr = '';
  var decimals = 6;

  function log(msg, kind) {
    var d = document.createElement('div');
    if (kind) d.className = kind;
    var t = new Date().toTimeString().slice(0, 8);
    d.textContent = '[' + t + '] ' + msg;
    var box = $('log');
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  function b58(a) {
    try { return ro.address.fromHex(a); } catch (e) { return a; }
  }

  function fmt(raw, dec) {
    dec = dec == null ? decimals : dec;
    var s = String(raw);
    if (s.length <= dec) s = new Array(dec - s.length + 1).join('0') + s;
    var ip = s.slice(0, s.length - dec) || '0';
    var fp = dec ? s.slice(s.length - dec).replace(/0+$/, '') : '';
    return fp ? ip + '.' + fp : ip;
  }

  function toRaw(human, dec) {
    dec = dec == null ? decimals : dec;
    var s = String(human).trim();
    if (!/^\d+(\.\d+)?$/.test(s)) throw new Error('数量格式不对');
    var parts = s.split('.');
    var fp = (parts[1] || '').slice(0, dec);
    while (fp.length < dec) fp += '0';
    return BigInt(parts[0] + fp).toString();
  }

  function loadScript(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        reject(new Error('timeout'));
      }, timeoutMs);
      s.src = url;
      s.onload = function () { if (done) return; done = true; clearTimeout(timer); resolve(); };
      s.onerror = function () { if (done) return; done = true; clearTimeout(timer); reject(new Error('load error')); };
      document.head.appendChild(s);
    });
  }

  var libState = 'idle';
  var libWaiters = [];

  async function ensureLib() {
    if (typeof TronWeb !== 'undefined') { libState = 'ok'; return true; }
    if (libState === 'ok') return true;
    if (libState === 'loading') {
      return new Promise(function (res) { libWaiters.push(res); });
    }
    libState = 'loading';
    log('正在加载链上库…');
    for (var i = 0; i < CDN.length; i++) {
      try {
        await loadScript(CDN[i], 9000);
      } catch (e) {
        log('第 ' + (i + 1) + ' 个源没通，换下一个…', 'w');
        continue;
      }
      if (typeof TronWeb !== 'undefined') {
        libState = 'ok';
        libWaiters.forEach(function (f) { f(true); });
        libWaiters = [];
        log('链上库已就绪', 's');
        return true;
      }
    }
    libState = 'fail';
    libWaiters.forEach(function (f) { f(false); });
    libWaiters = [];
    log('链上库没加载出来：三个源都不通（网络被挡）。换个网络或挂梯子后刷新页面。', 'e');
    return false;
  }

  function TronCtor() {
    if (typeof TronWeb === 'undefined') return null;
    if (typeof TronWeb === 'function') return TronWeb;
    if (TronWeb && typeof TronWeb.TronWeb === 'function') return TronWeb.TronWeb;
    if (TronWeb && typeof TronWeb.default === 'function') return TronWeb.default;
    return null;
  }

  function ready() {
    var Ctor = TronCtor();
    if (!Ctor) return false;
    if (!ro) {
      ro = new Ctor({ fullHost: HOST });
      ro.setAddress('TLYLWgFniBxATRNeKLAZ9sAJZzmRYmVURG');
    }
    return true;
  }

  async function readState() {
    if (!(await ensureLib()) || !ready()) return;
    var C = $('contract').value.trim();
    var T = $('token').value.trim();
    try {
      log('读取合约状态…');
      var c = await ro.contract(ABI, C);
      var owner = b58(await c.owner().call());
      var op = b58(await c.operator().call());
      var hot = b58(await c.hotWallet().call());
      var paused = await c.paused().call();
      var ver = await c.version().call();
      $('v-owner').textContent = owner;
      $('v-operator').textContent = op;
      $('v-hot').textContent = hot;
      $('v-paused').innerHTML = paused
        ? '<span class="tag bad">已暂停</span>'
        : '<span class="tag ok">运行中</span>';
      $('v-ver').textContent = ver;
      try {
        var tc = await ro.contract(TRC20, T);
        decimals = Number(await tc.decimals().call());
      } catch (e) { decimals = 6; }
      $('amount').placeholder = '自动 = min(授权额度, 余额) · 该代币 ' + decimals + ' 位小数';
      log('状态读取完成，代币精度 ' + decimals, 's');
    } catch (e) {
      log('读取失败：' + (e.message || e), 'e');
    }
  }

  async function queryOne() {
    if (!(await ensureLib()) || !ready()) return;
    var C = $('contract').value.trim();
    var T = $('token').value.trim();
    var from = $('from').value.trim();
    if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(from)) { log('from 地址格式不对，应该是 T 开头 34 位 base58', 'e'); return; }
    try {
      var c = await ro.contract(ABI, C);
      var allow = await c.remainingAllowance(T, from).call();
      var bal = await c.tokenBalanceOf(T, from).call();
      $('v-allow').textContent = fmt(allow.toString()) + '（' + allow.toString() + '）';
      $('v-bal').textContent = fmt(bal.toString()) + '（' + bal.toString() + '）';
      var auto = BigInt(allow.toString()) < BigInt(bal.toString()) ? BigInt(allow.toString()) : BigInt(bal.toString());
      var amt = $('amount').value.trim();
      var target = amt ? toRaw(amt) : auto.toString();
      $('v-amount').textContent = fmt(target) + '（' + target + '）';
      log('查询完成：授权 ' + fmt(allow.toString()) + ' / 余额 ' + fmt(bal.toString()), 's');
      if (BigInt(target) > BigInt(allow.toString())) log('注意：归集量超过授权额度，链上会失败', 'w');
    } catch (e) {
      log('查询失败：' + (e.message || e), 'e');
    }
  }

  async function connect() {
    try {
      if (!window.tronLink && !window.tronWeb) { log('没检测到 TronLink，请先装插件或打开 TronLink App 的 DApp 浏览器', 'e'); return; }
      if (window.tronLink && window.tronLink.request) {
        await window.tronLink.request({ method: 'tron_requestAccounts' });
      }
      linkWeb = window.tronLink && window.tronLink.tronWeb ? window.tronLink.tronWeb : window.tronWeb;
      if (!linkWeb) { log('钱包还没解锁，点一下 TronLink 图标解锁再试', 'w'); return; }
      walletAddr = linkWeb.defaultAddress.base58;
      $('walletBadge').textContent = '钱包：' + walletAddr.slice(0, 6) + '…' + walletAddr.slice(-4);
      var host = linkWeb.fullNode && linkWeb.fullNode.host ? linkWeb.fullNode.host : '';
      if (host && host.indexOf('nile') === -1) log('钱包当前网络不是 Nile（' + host + '），发起交易会失败，先切网络', 'w');
      else log('钱包已连接：' + walletAddr, 's');
    } catch (e) {
      log('连接失败：' + (e.message || e), 'e');
    }
  }

  async function collect() {
    if (!(await ensureLib()) || !ready()) return;
    var C = $('contract').value.trim();
    var T = $('token').value.trim();
    var from = $('from').value.trim();
    if (!linkWeb || !walletAddr) { log('先点「连接 TronLink」', 'w'); return; }
    if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(from)) { log('from 地址格式不对', 'e'); return; }
    try {
      var c = await linkWeb.contract(ABI, C);
      var allow = await ro.contract(ABI, C).then(function (x) { return x.remainingAllowance(T, from).call(); });
      var bal = await ro.contract(ABI, C).then(function (x) { return x.tokenBalanceOf(T, from).call(); });
      var amt = $('amount').value.trim();
      var auto = BigInt(allow.toString()) < BigInt(bal.toString()) ? BigInt(allow.toString()) : BigInt(bal.toString());
      var value = amt ? toRaw(amt) : auto.toString();
      if (BigInt(value) <= 0n) { log('归集量为 0，没东西可归（授权额度或余额是 0）', 'w'); return; }
      if (BigInt(value) > BigInt(allow.toString())) { log('归集量超过授权额度，链上会报 C:TRANSFER_FAILED', 'e'); return; }
      log('准备归集 ' + fmt(value) + ' → hotWallet，等待钱包确认…', 'w');
      var tx = await c.collect(T, from, value).send({ feeLimit: 100 * 1000000, callValue: 0 });
      var id = typeof tx === 'string' ? tx : (tx.txid || tx.transaction && tx.transaction.txID || '');
      log('已广播：' + id, 's');
      log('到 nile.tronscan.org 查这笔交易，看 Collected 事件和 hotWallet 余额变化');
    } catch (e) {
      var m = e && e.message ? e.message : String(e);
      if (/NOT_OPERATOR/.test(m)) m += ' → 当前钱包地址既不是 owner 也不是 operator';
      else if (/PAUSED/.test(m)) m += ' → 合约被 setPaused(true) 停了';
      else if (/TRANSFER_FAILED/.test(m)) m += ' → 授权额度不足、余额不足，或代币不允许';
      else if (/USER_REJECTED|declined|Confirmation declined/i.test(m)) m = '你在钱包里取消了签名';
      log('归集失败：' + m, 'e');
    }
  }

  $('btnRead').onclick = readState;
  $('btnQuery').onclick = queryOne;
  $('btnConnect').onclick = connect;
  $('btnCollect').onclick = collect;

  var boot = function () {
    ensureLib().then(function (ok) {
      if (!ok) return;
      if (!ready()) return;
      log('面板就绪 · 合约 ' + $('contract').value.slice(0, 8) + '…');
      readState();
    });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
